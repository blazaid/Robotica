<h1>Algoritmos evolutivos</h1>
<h2>Robótica - Grado en Ingeniería de Computadores</h2>
<h3>Departamento de Sistemas Informáticos</h3>
<h4>E.T.S.I. de Sistemas Informáticos - Universidad Politécnica de Madrid</h4>
<p><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/"><img src="https://img.shields.io/badge/License-CC%20BY--NC--SA%204.0-informational.svg" alt="" style="height:30px;" /></a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="2" data-marpit-pagination-total="43" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Introducción</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="etsisi" data-marpit-pagination="3" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Definición</h1>
<p>Los <strong>algoritmos evolutivos (EAs)</strong> son técnicas metaheurísticas para resolver problemas de optimización, búsqueda y <em>machine learning</em>. Estas técnicas se inspiran en procesos que suceden en la naturaleza, como la <strong>selección natural</strong>, la supervivencia del <strong>más fuerte</strong> y la <strong>transmisión genética</strong> de los rasgos de los padres a sus hijos.</p>
<ul>
<li>Desde un punto de vista <strong>matemático</strong>, los EAs se consideran métodos <strong>numéricos</strong></li>
<li>Desde un punto de vista <strong>computacional</strong>, estas técnicas se consideran programas <strong>software</strong></li>
<li>Desde el punto de vista de otras <strong>aplicaciones</strong>, los EAs son simplemente <strong>herramientas</strong> disponibles para su uso</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="etsisi" data-marpit-pagination="4" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Aplicaciones</h1>
<p>Una de las principales <strong>ventajas</strong> de estas técnicas es su gran aplicabilidad a la resolución de <strong>multitud de tareas</strong>. Algunos ejemplos son:</p>
<ul>
<li>Optimización numérica, como el <strong>problema de la mochila</strong> o el <strong>problema del viajante</strong></li>
<li>Particionado de <strong>grafos</strong></li>
<li>Diseño de circuitos <strong>VLSI (<em>Very Large Scale Integration</em>)</strong>: proceso de crear un circuito integrado compuesto por cientos de miles de transistores en un único chip</li>
<li><strong>Diseño y entrenamiento</strong> de redes neuronales y arquitecturas profundas</li>
<li><strong>Telecomunicaciones</strong>: redes de sensores, distribución de antenas de telecomunicación, etc.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="etsisi" data-marpit-pagination="5" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Ventajas e inconvenientes</h1>
<p>Ventajas:</p>
<ul>
<li>Trabajan sobre la <strong>codificación</strong> de un problema</li>
<li>Aplicabilidad <strong>muy alta</strong>, basta con encontrar una codificación apropiada para tu problema</li>
<li>No se obtiene solo una buena solución, sino toda una <strong>población de buenas soluciones</strong></li>
<li>Explotación y exploración del espacio de <strong>búsqueda configurable</strong></li>
</ul>
<p>Inconvenientes:</p>
<ul>
<li><strong>No está asegurado</strong> encontrar un óptimo</li>
<li>Hay muchas <strong>líneas de investigación</strong> abiertas</li>
<li>Alta <strong>demanda computacional</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="6" data-marpit-pagination-total="43" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Elementos de un algoritmo evolutivo</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="etsisi" data-marpit-pagination="7" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Elementos de un algoritmo evolutivo</h1>
<ul>
<li><strong>Población</strong>: conjunto de puntos del espacio de búsqueda en un momento dado del proceso de evolución</li>
<li><strong>Individuo</strong>: cada uno de los puntos del espacio de búsqueda</li>
<li><strong>Gen</strong>: cada uno de los parámetros de un individuo</li>
<li><strong>Alelo</strong>: cada uno de los posibles valores de un gen</li>
<li><strong>Cromosoma</strong>: individuo</li>
</ul>
<center>
<p><img src="images/t3/Individuos%20y%20poblaci%C3%B3n.png" alt="" style="height:300px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="etsisi" data-marpit-pagination="8" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Genotipo vs. fenotipo</h1>
<p><strong>Genotipo</strong></p>
<ul>
<li><strong>Espacio de búsqueda</strong>: toda la información genética disponible, es decir, todas las soluciones posibles a nuestro problema</li>
</ul>
<p><strong>Fenotipo</strong></p>
<ul>
<li><strong>Espacio de soluciones</strong>: la expresión física de las características de las soluciones</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="etsisi" data-marpit-pagination="9" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Codificación de individuos</h1>
<p>A la hora de aplicar un <strong>algoritmo evolutivo</strong> uno de los pasos esenciales es pensar cómo se van a <strong>codificar las soluciones</strong>.</p>
<p>En este punto definimos <strong>individuo</strong> como cada una de las soluciones <strong>propuestas</strong> por el algoritmo.</p>
<ul>
<li>Ejemplo: <strong>receta de galletas</strong></li>
</ul>
<center>
<p><img src="images/t3/Individuo_Galletas_Codificacion.png" alt="" style="height:300px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="etsisi" data-marpit-pagination="10" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Codificación de individuos</h1>
<ul>
<li>Ejemplo: <strong>receta de galletas</strong></li>
</ul>
<center>
<p><img src="images/t3/Individuo_Galletas_Codificacion_1.png" alt="" style="width:850px;" /></p>
</center>
<p><strong>¿Y si lo codificamos así?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="etsisi" data-marpit-pagination="11" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Instanciación de soluciones</h1>
<p>Como cada individuo representa <strong>una solución</strong>, los individuos deberán ser <strong>instanciados</strong> con ciertos valores.</p>
<p>Ejemplo: <strong>receta de galletas</strong></p>
<center>
<p><img src="images/t3/Individuo_Galletas_0.png" alt="" style="width:400px;" /></p>
</center>
<center>
<p><img src="images/t3/Individuo_Galletas_1.png" alt="" style="width:400px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="etsisi" data-marpit-pagination="12" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Ejemplo: problema de la mochila</h1>
<p>Se necesitan <strong>seleccionar objetos</strong> con cierto valor y peso. El objetivo es <strong>optimizar el valor total</strong>. No se puede superar el <strong>peso máximo a transportar</strong>.</p>
<center>
<p><img src="images/t3/Problema_Mochila.png" alt="" style="width:850px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="etsisi" data-marpit-pagination="13" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Ejemplo: problema de la mochila</h1>
<p><strong>¿Cómo codificamos cada solución?</strong></p>
<center>
<p><img src="images/t3/Problema_Mochila_1.png" alt="" style="width:850px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="etsisi" data-marpit-pagination="14" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Codificación real y binaria</h1>
<p>Existen dos maneras de codificar los <strong>genes</strong> de cada individuo:</p>
<ul>
<li><strong>Codificación real</strong> (alfabeto infinito)</li>
</ul>
<center>
<p><img src="images/t3/Individuo_Galletas_1.png" alt="" style="width:375px;" /></p>
</center>
<ul>
<li><strong>Codificación binaria</strong> (alfabeto finito)</li>
</ul>
<center>
<p><img src="images/t3/Problema_Mochila_2.png" alt="" style="width:375px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="etsisi" data-marpit-pagination="15" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Individuos no válidos</h1>
<p>Dependiendo de la <strong>codificación</strong> encontraremos <strong>individuos no válidos</strong> entre las posibles soluciones propuestas:</p>
<center>
<p><img src="images/t3/Individuo_No_Valido.png" alt="" style="width:800px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="etsisi" data-marpit-pagination="16" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Individuos no válidos: operadores de reparación</h1>
<p>Los <strong>operadores de reparación</strong> buscan convertir <strong>individuos no válidos</strong> en <strong>válidos</strong>.</p>
<p>En el ejemplo del problema de la mochila, por ejemplo, <strong>eliminar el elemento más pesado</strong>:</p>
<center>
<p><img src="images/t3/Individuo_Valido.png" alt="" style="width:700px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="etsisi" data-marpit-pagination="17" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Individuos no válidos</h1>
<p>¿Qué se puede hacer con los individuos no válidos?</p>
<ul>
<li><strong>Eliminarlos</strong>: ineficiente</li>
<li><strong>Valor malo de adaptación</strong>: puede converger a <strong>soluciones malas</strong></li>
<li><strong>Repararlos</strong>: difíciles de buscar, no siempre es posible. Puede dar lugar a comportamientos extraños</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="etsisi" data-marpit-pagination="18" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Codificación biyectiva</h1>
<p>La <strong>codificación biyectiva</strong> sucede cuando cada <strong>solución de las posibles</strong> tiene una <strong>única codificación</strong>. Es la <strong>situación ideal</strong>.</p>
<center>
<p><img src="images/t3/Codificacion_Biyectiva.png" alt="" style="width:850px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="etsisi" data-marpit-pagination="19" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Codificación inyectiva y sobreyectiva</h1>
<p>En la <strong>codificación inyectiva</strong> cada <strong>solución</strong> está codificada por <strong>un individuo</strong> como máximo.</p>
<ul>
<li>Esto genera que haya <strong>soluciones</strong> inaccesibles</li>
</ul>
<p>En la <strong>codificación sobreyectiva</strong> cada <strong>solución</strong> está codificada por <strong>un individuo</strong> como mínimo.</p>
<ul>
<li>Esto genera que haya varios individuos que generan la misma <strong>solución</strong></li>
<li>Se aumenta el <strong>espacio de búsqueda</strong></li>
<li>Si <strong>varios individuos</strong> codifican el <strong>óptimo</strong>, este es más fácil de encontrar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="etsisi" data-marpit-pagination="20" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Función de fitness</h1>
<p>La <strong>función de fitness</strong> es una <strong>métrica que evalúa</strong> cómo de óptima es cada una de las soluciones propuestas:</p>
<center>
<p><img src="images/t3/Fitness_0.png" alt="" style="width:850px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="etsisi" data-marpit-pagination="21" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Función de fitness</h1>
<p><strong>No siempre</strong> es fácil definir el fitness:</p>
<center>
<p><img src="images/t3/Fitness_1.png" alt="" style="width:600px;" /></p>
</center>
<center>
<p><img src="images/t3/Fitness_2.png" alt="" style="width:600px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="etsisi" data-marpit-pagination="22" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Función de fitness</h1>
<p>La <strong>función de fitness</strong> es uno de los elementos <strong>más importantes</strong> a la hora de diseñar los algoritmos evolutivos. Deberá medir la <strong>calidad</strong> de las soluciones parciales exploradas.</p>
<p>Esta función <strong>depende del problema</strong> y por lo tanto no hay una regla de oro para crearla. Sin embargo, sí hay ciertas características deseables:</p>
<ul>
<li><strong>Escalado</strong>: debe separar al máximo los distintos valores de fitness de los individuos</li>
<li><strong>Compartición</strong>: las soluciones parecidas deben tener valores similares</li>
<li><strong>Ranking</strong>: la población se deberá poder ordenar respecto a su calidad, usando el fitness</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="etsisi" data-marpit-pagination="23" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Fitness para el problema de las n reinas</h1>
<p>¿Qué función de fitness se puede diseñar para el problema de las n reinas?</p>
<center>
<p><img src="images/t3/N_Queens.png" alt="" style="height:420px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="etsisi" data-marpit-pagination="24" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Fitness para el problema de las n reinas</h1>
<p><strong>Fitness</strong>: 1 si solución encontrada, 0 si no.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1em;align-items:center">
<div>
<center>
<p><img src="images/t3/N_Queens.png" alt="" style="width:480px;" /></p>
</center>
</div>
<div>
<ul>
<li><strong>Escalado</strong>: <strong>no se cumple</strong>, ya que la mayoría de individuos valdrán 0</li>
<li><strong>Compartición</strong>: <strong>sí se cumple</strong>, pero la agrupación será única</li>
<li><strong>Ranking</strong>: <strong>no se cumple</strong>, no hay gradiente de soluciones</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="etsisi" data-marpit-pagination="25" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Fitness para el problema de las n reinas</h1>
<p><strong>Fitness</strong>: número de reinas en jaque.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1em;align-items:center">
<div>
<center>
<p><img src="images/t3/N_Queens.png" alt="" style="width:480px;" /></p>
</center>
</div>
<div>
<ul>
<li><strong>Escalado</strong>: <strong>sí se cumple</strong>, los individuos distintos tendrán valores distintos</li>
<li><strong>Compartición</strong>: <strong>sí se cumple</strong>, soluciones con el mismo número de reinas en jaque tienen el mismo valor</li>
<li><strong>Ranking</strong>: <strong>sí se cumple</strong>, a menor número, mejor solución</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="etsisi" data-marpit-pagination="26" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Fitness para el problema de las n reinas</h1>
<p><strong>Fitness</strong>: número de reinas <strong>NO</strong> en jaque.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1em;align-items:center">
<div>
<center>
<p><img src="images/t3/N_Queens.png" alt="" style="width:480px;" /></p>
</center>
</div>
<div>
<p>Los algoritmos evolutivos pueden <strong>maximizar</strong> o <strong>minimizar</strong> la función de fitness.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="27" data-marpit-pagination-total="43" style="--paginate:true;--class:section;--theme:etsisi;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="etsisi" data-marpit-pagination="36" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Operador de mutación</h1>
<p>Dependiendo de la codificación se pueden aplicar distintos <strong>operadores de mutación</strong></p>
<ul>
<li><strong>Alfabeto finito</strong>
<ul>
<li>Se cambia el <strong>valor del gen</strong> por otro del alfabeto</li>
</ul>
</li>
<li><strong>Alfabeto infinito</strong>
<ul>
<li>Se <strong>suma o resta</strong> cierto valor (aleatorio o no) a dicho gen</li>
<li>Se reemplaza por otro valor <strong>aleatorio</strong></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="etsisi" data-marpit-pagination="37" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Operador de cruce</h1>
<p>Existen distintas posibilidades para el <strong>operador de cruce</strong>. El más sencillo es el operador de cruce en dos puntos:</p>
<center>
<p><img src="images/t3/Cruce.png" alt="" style="width:900px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="etsisi" data-marpit-pagination="38" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Operador de reemplazo</h1>
<p>El <strong>operador de reemplazo</strong> sustituye un <strong>X%</strong> de la población por <strong>nuevos individuos generados</strong>.</p>
<ul>
<li><strong>Elitismo</strong>
<ul>
<li>Consiste en <strong>asegurarse de mantener</strong> los mejores X individuos de la población inicial</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="etsisi" data-marpit-pagination="39" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Búsqueda de soluciones</h1>
<p>Una vez aplicado el proceso de optimización del algoritmo genético existen <strong>muchas variables y probabilidades a cambiar</strong>, por ejemplo la <strong>probabilidad de mutación</strong>.</p>
<p>De cada problema dependerá encontrar una <strong>solución óptima</strong>; sin embargo, aparecen aquí dos conceptos:</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:2em">
<div>
<p><strong>Búsqueda local</strong></p>
<p>Consiste en buscar soluciones <strong>cercanas</strong> a las actuales. Es un proceso de <strong>refinación</strong>.</p>
<p>Se escogen valores <strong>conservadores</strong> de mutación, cruce y reemplazo.</p>
</div>
<div>
<p><strong>Búsqueda global</strong></p>
<p>Consiste en buscar soluciones <strong>alejadas</strong> de las actuales. Es un proceso de <strong>búsqueda</strong>.</p>
<p>Se escogen valores <strong>exploratorios</strong> de mutación, cruce y reemplazo.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="etsisi" data-marpit-pagination="40" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Búsqueda global</h1>
<p>El problema de la búsqueda global es que tiene un <strong>comportamiento errático</strong> y puede no encontrar soluciones.</p>
<center>
<p><img src="images/t3/Busqueda_Global.png" alt="" style="height:380px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="etsisi" data-marpit-pagination="41" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Búsqueda local</h1>
<p>El problema de la búsqueda local es que tiene una <strong>lenta convergencia</strong> y puede caer en <strong>mínimos locales</strong>.</p>
<center>
<p><img src="images/t3/Busqueda_Local.png" alt="" style="height:380px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="etsisi" data-marpit-pagination="42" data-marpit-pagination-total="43" style="--paginate:true;--theme:etsisi;">
<h1>Estrategia de búsqueda</h1>
<p>Lo más habitual es <strong>cambiar los valores del algoritmo</strong> para pasar de una búsqueda global a local.</p>
<ul>
<li>Al principio, se realizará una <strong>búsqueda exploratoria</strong> que busque distintas soluciones</li>
<li>A medida que el algoritmo avance, se <strong>explorarán en profundidad</strong> dichas soluciones, buscando el <strong>óptimo global</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="endpage" data-theme="etsisi" class="endpage" data-marpit-pagination="43" data-marpit-pagination-total="43" style="--paginate:true;--class:endpage;--theme:etsisi;">
<h1>¡GRACIAS!</h1>
</section>
