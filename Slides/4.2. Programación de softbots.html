<h1>Bloque 1</h1>
<h2>Servicios accesibles a través de Internet</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="etsisi" data-marpit-pagination="4" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>El modelo cliente-servidor</h1>
<p>Es el modelo de comunicación sobre el que se construye toda la Web:</p>
<ul>
<li><strong>Cliente</strong>: solicita recursos (por ejemplo, nuestro softbot)</li>
<li><strong>Servidor</strong>: proporciona los recursos solicitados</li>
</ul>
<p>Una sesión se inicia cuando el cliente envía una petición al servidor:</p>
<ol>
<li>El cliente establece una conexión (típicamente TCP) con el servidor</li>
<li>El cliente envía una <strong>petición</strong> (<em>request</em>) y espera respuesta</li>
<li>El servidor procesa la petición y envía una <strong>respuesta</strong> (<em>response</em>), incluyendo un <strong>código de estado</strong></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="etsisi" data-marpit-pagination="5" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>El modelo cliente-servidor</h1>
<center>
<p><img src="images/t4/ClientServer_Architecture.png" alt="" style="width:900px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.geeksforgeeks.org/system-design/client-server-model/">https://www.geeksforgeeks.org/system-design/client-server-model/</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="etsisi" data-marpit-pagination="6" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>El protocolo HTTP</h1>
<p><em>Hypertext Transfer Protocol</em> (HTTP), diseñado en 1990, es la base de la comunicación de datos en la Web.</p>
<ul>
<li>Protocolo a nivel de aplicación, construido sobre TCP/IP</li>
<li>Puerto estándar 80 (HTTP) y 443 (HTTPS, la versión cifrada)</li>
<li>Hoy en día se usa mayoritariamente HTTP/2 (RFC 7540) y, cada vez más, HTTP/3</li>
<li>Es lo bastante abierto como para no impedir el desarrollo de aplicaciones de terceros, como nuestros softbots</li>
</ul>
<p>HTTP se usa principalmente para transmitir <strong>recursos</strong>:</p>
<ul>
<li>Un recurso es un fragmento de información identificable mediante una URL</li>
<li>Puede ser un archivo estático o una salida generada dinámicamente</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="etsisi" data-marpit-pagination="7" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>URL: identificando recursos en la Web</h1>
<p>Una <em>Uniform Resource Locator</em> (URL) tiene la siguiente estructura:</p>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>protocolo://servidor:puerto/path/hasta/el/recurso?query=con&amp;algun=parametro
</span></span></foreignObject></svg></code></pre>
<p>Por ejemplo:</p>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>https://www.google.com/search?q=boniato+al+horno&amp;sclient=gws-wiz-serp
</span></span></foreignObject></svg></code></pre>
<ul>
<li>Si no se especifica el puerto, se usa el puerto por defecto del protocolo (HTTP: 80, HTTPS: 443)</li>
<li>La parte <code>?query=con&amp;algun=parametro</code> se conoce como <em>query string</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="etsisi" data-marpit-pagination="8" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Mensajes en HTTP: request y response</h1>
<p>Toda comunicación HTTP se basa en dos tipos de mensaje:</p>
<ul>
<li><strong>Request</strong>: mensaje enviado por el cliente al servidor</li>
<li><strong>Response</strong>: mensaje enviado por el servidor al cliente</li>
</ul>
<p>Ambos comparten estructura, con diferencias:</p>
<ul>
<li>Ambos poseen cabeceras con metainformación (<em>headers</em>)</li>
<li>Ambos pueden incluir un cuerpo adicional con datos</li>
<li>La request indica el <strong>método</strong> y el <strong>recurso</strong> al que se quiere acceder</li>
<li>La response indica el <strong>código de estado</strong> de la respuesta</li>
</ul>
<p>La estructura exacta de los mensajes difiere entre HTTP/1.1 y HTTP/2, pero las bibliotecas de Python nos abstraen de ese detalle.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="etsisi" data-marpit-pagination="9" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Métodos HTTP</h1>
<table>
<thead>
<tr>
<th>Método</th>
<th>Propósito</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>GET</code></td>
<td>Solicita un recurso</td>
</tr>
<tr>
<td><code>HEAD</code></td>
<td>Solicita solo los metadatos de un recurso</td>
</tr>
<tr>
<td><code>POST</code></td>
<td>Envía datos al servidor (p. ej. crear un recurso)</td>
</tr>
<tr>
<td><code>PUT</code></td>
<td>Envía un recurso completo para reemplazar uno existente</td>
</tr>
<tr>
<td><code>PATCH</code></td>
<td>Envía una actualización parcial de un recurso</td>
</tr>
<tr>
<td><code>DELETE</code></td>
<td>Elimina un recurso</td>
</tr>
<tr>
<td><code>OPTIONS</code></td>
<td>Solicita qué métodos soporta el servidor para un recurso</td>
</tr>
<tr>
<td><code>CONNECT</code> / <code>TRACE</code></td>
<td>Uso avanzado: túneles y diagnóstico</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Esto es la teoría, porque en la práctica cada servidor implementa lo que necesita.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="etsisi" data-marpit-pagination="10" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Códigos de estado (status codes)</h1>
<p>Números de tres dígitos que indican el resultado de la petición:</p>
<ul>
<li><strong>1xx</strong>: información</li>
<li><strong>2xx</strong>: éxito (p. ej. <code>200 OK</code>, <code>201 Created</code>)</li>
<li><strong>3xx</strong>: redirección (p. ej. <code>301 Moved Permanently</code>)</li>
<li><strong>4xx</strong>: error del cliente (p. ej. <code>404 Not Found</code>, <code>429 Too Many Requests</code>)</li>
<li><strong>5xx</strong>: error del servidor (p. ej. <code>500 Internal Server Error</code>)</li>
</ul>
<p>Al igual que los métodos, son un estándar, pero no son de obligado cumplimiento</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="etsisi" data-marpit-pagination="11" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Códigos de estado (status codes)</h1>
<center>
<p><img src="images/t4/http_ranges.png" alt="" style="width:400px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://tracy.hashnode.dev/http-response-status-codes">https://tracy.hashnode.dev/http-response-status-codes</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="etsisi" data-marpit-pagination="12" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Servicios web y APIs</h1>
<p>Un <strong>servicio web</strong> es un conjunto de protocolos y estándares que permiten la comunicación entre aplicaciones, normalmente sobre HTTP.</p>
<ul>
<li>Un conjunto de servicios web con un propósito común se denomina <strong>API</strong> (<em>Application Programming Interface</em>)</li>
<li>Para nuestros softbots, las APIs son la forma más limpia de <strong>percibir y actuar</strong> sobre un sistema externo, mucho más fiable que interpretar una página web pensada para humanos</li>
</ul>
<p>Históricamente, algunos estándares (SOAP, WSDL) formalizaban mucho esta comunicación; hoy dominan estilos más ligeros como <strong>REST</strong>, con datos en JSON.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="etsisi" data-marpit-pagination="13" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>El estilo arquitectónico REST</h1>
<p><em>Representational State Transfer</em> (REST) <strong>no es un protocolo</strong>, es un conjunto de principios de diseño para construir servicios web (Fielding, 2000):</p>
<ul>
<li><strong>Interfaz uniforme</strong>: la información se envía en un formato estándar (JSON, XML...)</li>
<li><strong>Sin estado</strong>: cada petición se resuelve de forma independiente (es inherente a HTTP)</li>
<li><strong>Distribuido</strong>: permite que varios servidores trabajen juntos</li>
<li><strong>Cacheable</strong>: las respuestas pueden almacenarse en caché para mejorar el rendimiento</li>
<li><strong>Código bajo demanda</strong> <em>(opcional)</em>: el servidor puede enviar código ejecutable al cliente</li>
</ul>
<p>Las APIs que siguen estos principios se llaman <strong>API RESTful</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="etsisi" data-marpit-pagination="14" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Anatomía de una API RESTful</h1>
<p>Una petición a una API RESTful típica requiere:</p>
<ul>
<li><strong>URL</strong>: la ruta hacia el recurso o servicio</li>
<li><strong>Método</strong>: la acción a realizar
<ul>
<li><code>GET /games</code> (listar) · <code>GET /games/1</code> (un elemento)</li>
<li><code>POST /games</code> (crear) · <code>PUT</code>/<code>PATCH /games/1</code> (actualizar)</li>
<li><code>DELETE /games/1</code> (eliminar)</li>
</ul>
</li>
<li><strong>Cuerpo</strong>: la información enviada (en <code>POST</code>, <code>PUT</code>, <code>PATCH</code>)</li>
<li><strong>Cabeceras</strong>: información adicional, como datos de autenticación</li>
</ul>
<p>Es el estándar más extendido hoy en día, pero no es obligatorio ni universal.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="etsisi" data-marpit-pagination="15" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>API RESTful: Ejemplo</h1>
<center>
<p><img src="images/t4/APIRest_Example.png" alt="" style="width:800px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://codesnippet.io/github-api-tutorial/">https://codesnippet.io/github-api-tutorial/</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="etsisi" data-marpit-pagination="16" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Formatos de intercambio: JSON y XML</h1>
<ul>
<li><strong>JSON</strong> (<em>JavaScript Object Notation</em>): formato ligero, basado en pares clave-valor, hoy dominante en APIs REST</li>
<li><strong>XML</strong> (<em>eXtensible Markup Language</em>): formato basado en etiquetas anidadas, más verboso, aún presente en sistemas heredados y en SOAP</li>
</ul>
<pre><code class="language-json"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>{<span class="hljs-attr">&quot;id&quot;</span>: <span class="hljs-number">1</span>, <span class="hljs-attr">&quot;titulo&quot;</span>: <span class="hljs-string">&quot;Ejemplo&quot;</span>, <span class="hljs-attr">&quot;disponible&quot;</span>: <span class="hljs-literal">true</span>}
</span></span></foreignObject></svg></code></pre>
<pre><code class="language-xml"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-tag">&lt;<span class="hljs-name">juego</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;1&quot;</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">titulo</span>&gt;</span>Ejemplo<span class="hljs-tag">&lt;/<span class="hljs-name">titulo</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">disponible</span>&gt;</span>true<span class="hljs-tag">&lt;/<span class="hljs-name">disponible</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">juego</span>&gt;</span>
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="etsisi" data-marpit-pagination="17" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Otros estilos de API (contexto)</h1>
<p>No todo es REST. Conviene conocer, aunque sea brevemente, otras alternativas que te puedes encontrar:</p>
<ul>
<li><strong>SOAP</strong>: protocolo más formal y rígido que REST, con contratos definidos en WSDL; hoy en desuso frente a REST pero aún presente en sistemas empresariales heredados (banca, administración pública)</li>
<li><strong>GraphQL</strong>: el cliente especifica exactamente qué datos necesita en una única petición, evitando pedir de más o de menos</li>
<li><strong>gRPC</strong>: protocolo binario de alto rendimiento basado en HTTP/2, muy usado en comunicación entre microservicios</li>
</ul>
<p>Para un softbot que consume APIs de terceros, lo habitual seguirá siendo REST + JSON, pero es importante reconocer estas alternativas cuando aparezcan.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="etsisi" data-marpit-pagination="18" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Autenticación y autorización</h1>
<p>La mayoría de APIs útiles para un softbot requieren identificarse:</p>
<ul>
<li><strong>API key</strong>: una cadena fija (como una contraseña) que se envía en la petición (cabecera o parámetro), la forma más simple</li>
<li><strong>OAuth 2.0</strong>: estándar para delegar acceso sin compartir contraseñas; el softbot obtiene un <strong>token</strong><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container> de acceso tras un proceso de autorización</li>
<li><strong>JWT</strong> (<em>JSON Web Token</em>): token autocontenido y firmado, muy usado para transmitir identidad y permisos de forma compacta. Se suele combinar con OAuth 2.0</li>
</ul>
<p>Un softbot en producción nunca debe llevar estas credenciales escritas directamente en el código.</p>
<blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>: Suele ser un archivo .json</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="etsisi" data-marpit-pagination="19" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Límites de uso: rate limiting y paginación</h1>
<p>Casi ninguna API es de uso ilimitado:</p>
<ul>
<li><strong>Rate limiting</strong>: número máximo de peticiones permitidas en una ventana de tiempo; suele indicarse en cabeceras como <code>X-RateLimit-Remaining</code></li>
<li><strong>Paginación</strong>: cuando una colección es muy grande, la API la devuelve en páginas (<code>?page=2&amp;per_page=50</code>) en lugar de todo de golpe</li>
<li><strong>Cuotas</strong>: límites más amplios, por ejemplo mensuales, ligados a un plan de uso</li>
</ul>
<p>Un softbot bien diseñado <strong>respeta</strong> estos límites, tanto por corrección técnica como por buena convivencia con el servicio.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="etsisi" data-marpit-pagination="20" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Comunicación en tiempo real: WebSockets y webhooks</h1>
<p>No todo es petición-respuesta puntual:</p>
<ul>
<li><strong>WebSockets</strong>: conexión persistente y bidireccional entre cliente y servidor, útil cuando el softbot necesita recibir actualizaciones constantes (p. ej. temperatura en tiempo real)</li>
<li><strong>Webhooks</strong>: en lugar de que el softbot pregunte constantemente (&quot;¿hay algo nuevo?&quot;), el servidor le <strong>avisa</strong> enviando una petición HTTP a una URL que el softbot expone, en el momento en que ocurre un evento<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container></li>
</ul>
<blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>: Esta idea será clave cuando hablemos de arquitecturas de softbot orientadas a eventos frente a sondeo periódico.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="21" data-marpit-pagination-total="96" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Bloque 2</h1>
<h2>Web scraping</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="etsisi" data-marpit-pagination="22" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Por qué scrapear si existen las APIs?</h1>
<p>El <em>web scraping</em> es la técnica para <strong>extraer información de sitios web</strong> mediante software, navegando e interpretando el HTML como lo haría un humano con un navegador.</p>
<p>Es la alternativa cuando:</p>
<ul>
<li>El sitio <strong>no ofrece una API</strong> pública</li>
<li>La API existe pero es <strong>insuficiente</strong> (le faltan datos que sí están en la web)</li>
<li>Se necesita <strong>verificar</strong> que lo que ve un usuario real coincide con lo que devuelve la API</li>
</ul>
<p>Se basa en dos procesos:</p>
<ol>
<li><strong>Navegación</strong> por los sitios web (procesos llamados <em>spiders</em> o <em>crawlers</em>)</li>
<li><strong>Extracción</strong> de datos del contenido (<em>scraping</em> propiamente dicho)</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="etsisi" data-marpit-pagination="23" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Inconvenientes del web scraping</h1>
<p>Comparado con usar una API, el scraping:</p>
<ul>
<li>Es una técnica <strong>más costosa</strong> de desarrollar y mantener</li>
<li>Genera <strong>más tráfico</strong> entre cliente y servidor (se descarga la página completa, no solo el dato)</li>
<li>Es <strong>sensible a cambios</strong> en la estructura de las páginas (un rediseño puede romper el scraper)</li>
<li>Obliga a respetar las <strong>condiciones de uso</strong> del sitio, sean o no legalmente vinculantes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="etsisi" data-marpit-pagination="24" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Dominios de aplicación</h1>
<ul>
<li><strong>Automatización de negocio</strong>: evitar recopilar información manualmente de múltiples fuentes</li>
<li><strong>Estudios de mercado</strong>: agregación de datos públicos</li>
<li><strong>Generación de leads</strong>: listas de clientes potenciales</li>
<li><strong>Seguimiento de precios</strong>: e.g. <a href="https://camelcamelcamel.com/">CamelCamelCamel</a> para precios en Amazon</li>
<li><strong>Noticias y contenidos</strong>: agregadores</li>
<li><strong>Monitorización de marca</strong>: qué se dice de una empresa en Internet</li>
<li><strong>Mercado inmobiliario</strong>: qué se vende y a qué precio</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="etsisi" data-marpit-pagination="25" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Estructura de una página web: HTML y el DOM</h1>
<p>Para scrapear con criterio hay que entender qué se está leyendo:</p>
<ul>
<li><strong>HTML</strong>: lenguaje de marcado que define el contenido y la estructura de una página</li>
<li><strong>DOM</strong> (<em>Document Object Model</em>): representación en forma de <strong>árbol</strong> de ese HTML una vez cargado, donde cada etiqueta es un nodo</li>
<li><strong>CSS</strong>: además de dar estilo, sus <strong>selectores</strong> (clases, identificadores) son la forma más habitual de localizar un elemento concreto dentro del árbol</li>
</ul>
<pre><code class="language-html"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;producto&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;p1&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h2</span>&gt;</span>Claveles<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;precio&quot;</span>&gt;</span>10.59€<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="etsisi" data-marpit-pagination="26" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Estructura de una página web: HTML y el DOM</h1>
<center>
<p><img src="images/t4/HTML_DOM.png" alt="" style="width:800px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.geeksforgeeks.org/html/javascript-html-dom/">https://www.geeksforgeeks.org/html/javascript-html-dom/</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="etsisi" data-marpit-pagination="27" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Localizar contenido: selectores CSS y XPath</h1>
<p>Dos lenguajes de consulta para &quot;apuntar&quot; a un nodo concreto del DOM:</p>
<ul>
<li><strong>Selectores CSS</strong>: <code>.precio</code>, <code>#p1</code>, <code>div.producto &gt; span</code> — sintaxis familiar si ya conoces CSS</li>
<li><strong>XPath</strong>: lenguaje de consulta más potente, desarrollado por el W3C como parte de la recomendación XSLT, que permite navegar el árbol con más precisión (W3C, 1999)</li>
</ul>
<pre><code class="language-text"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>//div[@class=&quot;producto&quot;]/span[@class=&quot;precio&quot;]/text()
</span></span></foreignObject></svg></code></pre>
<p>XPath permite seleccionar elementos por nombre, atributos y posición, admite operadores lógicos y aritméticos, y accede sin problema a estructuras muy anidadas.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="etsisi" data-marpit-pagination="28" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Scraping estático vs. dinámico</h1>
<ul>
<li><strong>Contenido estático</strong>: todo el HTML relevante llega ya completo en la respuesta del servidor — basta con descargar y parsear</li>
<li><strong>Contenido dinámico</strong>: la página se construye o completa <strong>en el navegador</strong>, ejecutando JavaScript después de la carga inicial</li>
</ul>
<p>Esta distinción es crucial porque determina qué herramienta necesitas:</p>
<ul>
<li>Estático → librerías HTTP + parseo de HTML (rápido y barato)</li>
<li>Dinámico → un <strong>navegador real (o headless)</strong> que ejecute el JavaScript antes de poder leer el resultado (más lento y costoso)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="29" data-marpit-pagination-total="96" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Herramientas para scraping estático</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="etsisi" data-marpit-pagination="30" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>La biblioteca <code>urllib</code></h1>
<p>Forma parte de la biblioteca estándar de Python, no requiere instalación.</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">from</span> urllib.request <span class="hljs-keyword">import</span> urlopen, Request

request = Request(<span class="hljs-string">&#x27;https://www.python.org/&#x27;</span>)
<span class="hljs-keyword">with</span> urlopen(request) <span class="hljs-keyword">as</span> response:
    received_bytes = response.read()
content = received_bytes.decode()
</span></span></foreignObject></svg></code></pre>
<p>Permite enviar parámetros por <code>GET</code> (codificándolos con <code>urlencode</code>), enviar datos por <code>POST</code>, subir ficheros y leer las cabeceras de la respuesta.</p>
<ul>
<li>Es funcional pero verbosa, por eso en la práctica se usa más <code>requests</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="etsisi" data-marpit-pagination="31" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Parámetros por <code>GET</code></h1>
<p>En el ejemplo anterior, la URL no incluía ningún parámetro</p>
<ul>
<li>En el caso de una petición <code>GET</code>, estos se añaden a la URL</li>
<li>Sin embargo, hay que tener cuidado con la codificación de los caracteres especiales</li>
</ul>
<p>Para ello, podemos usar la función <code>urlencode</code> de <code>urllib.parse</code></p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">from</span> urllib.parse <span class="hljs-keyword">import</span> urlencode

params = urlencode({<span class="hljs-string">&#x27;q&#x27;</span>: <span class="hljs-string">&#x27;python&#x27;</span>})
url = <span class="hljs-string">&#x27;https://www.google.com/search?&#x27;</span> + params
<span class="hljs-built_in">print</span>(url)
</span></span></foreignObject></svg></code></pre>
<p>Así nos aseguramos de que todo carácter especial es codificado correctamente</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="etsisi" data-marpit-pagination="32" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Datos por <code>POST</code></h1>
<p>Una petición de tipo POST envía los parámetros en el cuerpo de la petición</p>
<ul>
<li>No tiene sentido mandar parámetros porque no tendremos acceso a la <i>query string</i></li>
<li>POST es más flexible que GET, ya que permite enviar datos binarios (e.g. ficheros)</li>
</ul>
<p>Para enviar datos por POST, basta con crear la <i>request</i> con datos:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>data = urlencode({<span class="hljs-string">&#x27;key&#x27;</span>: <span class="hljs-string">&#x27;value&#x27;</span>}).encode()
request = Request(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, data=data)
<span class="hljs-keyword">with</span> urlopen(request) <span class="hljs-keyword">as</span> response:
    <span class="hljs-built_in">print</span>(response.read().decode())
</span></span></foreignObject></svg></code></pre>
<p>Esto no funciona si el cuerpo de datos es vacío</p>
<ul>
<li>Se puede solucionar añadiendo el argumento <code>method='POST'</code> al crear la <i>request</i></li>
<li>De hecho con este argumento se especifica el método de la petición</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="etsisi" data-marpit-pagination="33" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Formularios y <code>POST</code></h1>
<p>Los formularios HTML se envían por <code>POST</code> por defecto</p>
<ul>
<li>Cada campo del formulario se envía como un parámetro diferente</li>
</ul>
<p>Veamos los tipos más comunes:</p>
<ul>
<li><code>text</code>, <code>password</code>, <code>hidden</code>, <code>textarea</code>, <code>select</code>, <code>radio</code>: Se envía el <i>name</i>/<i>value</i> del campo</li>
<li><code>checkbox</code>: Se envían tantos <i>name</i>/<i>value</i> como checkboxes estén marcados</li>
</ul>
<p>Los formularios se pueden enviar también por <code>GET</code></p>
<ul>
<li>En este caso, los parámetros se añaden a la URL</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="etsisi" data-marpit-pagination="34" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Y si queremos enviar ficheros?</h1>
<p>De hecho, es una de las características de <code>POST</code> frente a <code>GET</code></p>
<ul>
<li>Es similar al caso anterior, pero enviando el contenido de un fichero</li>
<li>Es conveniente añadir ciertas cabeceras para indicar el tamaño y el tipo de contenido</li>
</ul>
<p>Por ejemplo, para enviar una imagen PNG:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">import</span> os

image_path = <span class="hljs-string">&#x27;images/python.png&#x27;</span>
image_size = os.path.getsize(image_path)
image_data = <span class="hljs-built_in">open</span>(image_path, <span class="hljs-string">&#x27;rb&#x27;</span>)
request = Request(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, data=image_data)
request.add_header(<span class="hljs-string">&#x27;Content-Length&#x27;</span>, image_size)
request.add_header(<span class="hljs-string">&#x27;Content-Type&#x27;</span>, <span class="hljs-string">&#x27;image/png&#x27;</span>)
<span class="hljs-keyword">with</span> urlopen(request) <span class="hljs-keyword">as</span> response:
    <span class="hljs-built_in">print</span>(response.read().decode())
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="etsisi" data-marpit-pagination="35" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Cabeceras HTTP relevantes para un scraper</h1>
<p>Estas cabeceras condicionan cómo nos &quot;ve&quot; el servidor:</p>
<ul>
<li><strong><code>Accept</code></strong>: qué formatos entiende el cliente (HTML, JSON...)</li>
<li><strong><code>Accept-Encoding</code></strong>: qué compresión soporta (<code>gzip</code>, <code>br</code>...)</li>
<li><strong><code>Accept-Language</code></strong>: idioma preferido</li>
<li><strong><code>User-Agent</code></strong>: identifica el tipo de cliente (navegador, móvil...)<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></svg></mjx-container></li>
<li><strong><code>Referer</code></strong>: la URL desde la que se ha llegado, útil para simular un patrón de navegación humano<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></svg></mjx-container></li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>request.add_header(<span class="hljs-string">&#x27;User-Agent&#x27;</span>, <span class="hljs-string">&#x27;Mozilla/5.0 (X11; Ubuntu; Linux x86_64) ...&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<p>Cuanto más se parezcan estas cabeceras a las de un navegador real, menos probable es que el servidor bloquee la petición.</p>
<blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></svg></mjx-container>: Clave para no destacar como scraper</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="etsisi" data-marpit-pagination="36" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Cómo leemos las cabeceras de una respuesta?</h1>
<p>Toda petición conlleva una respuesta con cabeceras y (a veces) datos</p>
<ul>
<li>La biblioteca <code>urllib</code> las comprime en un objeto <code>HTTPMessage</code></li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>request = Request(<span class="hljs-string">&#x27;https://www.python.org/&#x27;</span>)
<span class="hljs-keyword">with</span> urlopen(request) <span class="hljs-keyword">as</span> response:
    <span class="hljs-built_in">print</span>(response.headers)
</span></span></foreignObject></svg></code></pre>
<p>Este objeto se comporta como un diccionario</p>
<ul>
<li>Con el método <code>get</code> podemos obtener el valor de la cabecera indicada</li>
</ul>
<p>Veamos algunas cabeceras útiles</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="etsisi" data-marpit-pagination="37" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Cabecera <i>Accept</i></h1>
<p>Indica al servidor web qué formato de datos entiende cliente</p>
<ul>
<li>Por ejemplo, si el cliente entiende HTML, JSON, XML, etc.</li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>request = Request(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
request.add_header(<span class="hljs-string">&#x27;Accept&#x27;</span>, <span class="hljs-string">&#x27;application/json;q=0.9,*/*;q=0.8&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<p>El factor de calidad <code>q</code> indica la preferencia del cliente</p>
<ul>
<li>Se utiliza en las cabeceras que aceptan varios valores</li>
</ul>
<p>Es importante que la cadena sea similar a la ofrecida por los navegadores</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="etsisi" data-marpit-pagination="38" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Cabecera <i>Accept-Encoding</i></h1>
<p>Notifica al servidor web qué algoritmo de compresión utilizar para gestionar la petición</p>
<ul>
<li>Por ejemplo, si el cliente entiende <code>gzip</code>, <code>deflate</code>, <code>br</code>, etc.</li>
<li>Dicho de otro modo, si el cliente y el servidor pueden comprimir la información</li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>request = Request(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
request.add_header(<span class="hljs-string">&#x27;Accept-Encoding&#x27;</span>, <span class="hljs-string">&#x27;gzip, deflate, br&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<p>Esta cabecera es especialmente útil para reducir el tamaño de las respuestas</p>
<ul>
<li>Menos tiempo de espera y menos ancho de banda, win-win para cliente y servidor</li>
</ul>
<p>El <i>encoding</i> <code>br</code> (Brotli) se usa para identificar scrapers, pero <code>urllib</code> ya lo soporta</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="etsisi" data-marpit-pagination="39" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Cabecera <i>Accept-Language</i></h1>
<p>Indica al servidor qué idiomas prefiere el cliente</p>
<ul>
<li>Se puede especificar un único idioma o una lista de idiomas</li>
<li>Entra en juego cuando los servidores web no pueden identificar el idioma preferido</li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>request = Request(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
request.add_header(<span class="hljs-string">&#x27;Accept-Language&#x27;</span>, <span class="hljs-string">&#x27;en-US, en;q=0.9, es;q=0.8&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<p>Es un factor más a la hora de detectar comportamientos no humanos</p>
<ul>
<li>Puede ser útil hacer que los lenguajes se ajusten a la ubicación IP del cliente</li>
<li>También es útil ajustar los valores de <code>q</code> para no destacar frente al resto de tráfico</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="etsisi" data-marpit-pagination="40" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Cabecera <i>User-Agent</i></h1>
<p>El servidor utiliza esta información para identificar y adaptar el contenido al cliente</p>
<ul>
<li>Por ejemplo, si el cliente es un navegador web, un teléfono móvil, un reproductor multimedia, etc.</li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>request = Request(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
request.add_header(<span class="hljs-string">&#x27;User-Agent&#x27;</span>, <span class="hljs-string">&#x27;Mozilla/5.0 (X11; Ubuntu; Linux x86_64 ...&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<p>Suelen seguir el formato:</p>
<pre><code class="language-text"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>(&lt;navegador&gt;) (&lt;sistema&gt;) &lt;plataforma&gt; (&lt;detalles plataforma&gt;) &lt;extensiones&gt;
</span></span></foreignObject></svg></code></pre>
<p>Es importante porque ayuda a enmascarar el scraper como un navegador web</p>
<ul>
<li>Si el agente de usuario está mal formado, lo más normal es que el servidor lo bloquee</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="etsisi" data-marpit-pagination="41" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Cabecera <i>Referer</i></h1>
<p>Indica la URL de la página desde la que se ha hecho la petición</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>request = Request(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
request.add_header(<span class="hljs-string">&#x27;Referer&#x27;</span>, <span class="hljs-string">&#x27;https://www.google.com/&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<p>Esta cabecera es importante para identificar patrones de uso en usuarios</p>
<ul>
<li>Y los usuarios no suelen entrar en páginas web de forma aleatoria</li>
<li>Suelen venir de buscadores web, redes sociales, etc.</li>
</ul>
<p>Es interesante especificar esta cabecera para que el agente parezca más &quot;humano&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="etsisi" data-marpit-pagination="42" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>La biblioteca <code>requests</code></h1>
<p>Simplifica enormemente el trabajo frente a <code>urllib</code>:</p>
<ul>
<li>Gestión sencilla de cookies y sesiones</li>
<li>Codificación automática de contenido y de URLs internacionalizadas</li>
<li>Soporte simple para proxies, certificados SSL y streaming</li>
<li>Conexiones persistentes (<em>keep-alive</em>) automáticas</li>
</ul>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>bash
pip install requests
</span></span></foreignObject></svg></code></pre>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>python
import requests
response = requests.get('https://httpbin.org/anything', params={'p1': 'v1'})
response.raise_for_status()
datos = response.json()
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="etsisi" data-marpit-pagination="43" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Cómo realizo una petición HTTP?</h1>
<p>Tan sencillo como usar la función <code>get</code> de la biblioteca:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<p>De hecho, cada método tiene su propia función:</p>
<ul>
<li><code>get()</code>, <code>post()</code>, <code>put()</code>, <code>patch()</code>, <code>delete()</code>, <code>head()</code>, <code>options()</code></li>
</ul>
<p>Enviar parámetros también es sencillo, basta con usar el diccionario <code>params</code>:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, params={<span class="hljs-string">&#x27;p1&#x27;</span>:<span class="hljs-string">&#x27;v1&#x27;</span>,<span class="hljs-string">&#x27;p2&#x27;</span>:<span class="hljs-string">&#x27;v2&#x27;</span>})
</span></span></foreignObject></svg></code></pre>
<p>Y establecer un tiempo máximo de respuesta con el parámetro <code>timeout</code>:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, timeout=<span class="hljs-number">5</span>)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="etsisi" data-marpit-pagination="44" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Envío de datos en peticiones POST/PUT/PATCH</h1>
<p>En este caso, habría que utilizar el parámetro <code>data</code>:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.post(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, data={
  <span class="hljs-string">&#x27;param1&#x27;</span>: <span class="hljs-string">&#x27;val1&#x27;</span>,
  <span class="hljs-string">&#x27;param2&#x27;</span>: <span class="hljs-string">&#x27;val2&#x27;</span>
})
response.text
</span></span></foreignObject></svg></code></pre>
<p>No es necesario codificar los datos, la biblioteca lo hace por nosotros</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="etsisi" data-marpit-pagination="45" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Y si necesitamos especificar el tipo de contenido?</h1>
<p>En ese caso jugamos con las cabeceras:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.post(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, data={
    <span class="hljs-string">&#x27;param1&#x27;</span>: <span class="hljs-string">&#x27;val1&#x27;</span>,
    <span class="hljs-string">&#x27;param2&#x27;</span>: <span class="hljs-string">&#x27;val2&#x27;</span>
}, headers={<span class="hljs-string">&#x27;Content-Type&#x27;</span>: <span class="hljs-string">&#x27;text/xml&#x27;</span>})
response.text
</span></span></foreignObject></svg></code></pre>
<p>¡E incluso con los datos!</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.post(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>,
    data=<span class="hljs-string">&#x27;&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;soap:Envelope...&#x27;</span>,
    headers={<span class="hljs-string">&#x27;Content-Type&#x27;</span>: <span class="hljs-string">&#x27;text/xml&#x27;</span>})
response.text
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="etsisi" data-marpit-pagination="46" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Y si necesitamos enviar un fichero?</h1>
<p>Pues nada, para eso tenemos el parámetro <code>files</code>:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.post(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, files={
  <span class="hljs-string">&#x27;file1&#x27;</span>: <span class="hljs-built_in">open</span>(<span class="hljs-string">&#x27;file1.txt&#x27;</span>, <span class="hljs-string">&#x27;rb&#x27;</span>),
  <span class="hljs-string">&#x27;file2&#x27;</span>: <span class="hljs-built_in">open</span>(<span class="hljs-string">&#x27;file2.txt&#x27;</span>, <span class="hljs-string">&#x27;rb&#x27;</span>)
})
</span></span></foreignObject></svg></code></pre>
<p>Aunque también podemos especificar explícitamente el nombre y tipo del fichero:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>files = {<span class="hljs-string">&#x27;f1&#x27;</span>: (<span class="hljs-string">&#x27;cosa.pdf&#x27;</span>, <span class="hljs-built_in">open</span>(<span class="hljs-string">&#x27;algo.pdf&#x27;</span>, <span class="hljs-string">&#x27;rb&#x27;</span>), <span class="hljs-string">&#x27;application/pdf&#x27;</span>)}
response = requests.post(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, files=files)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="etsisi" data-marpit-pagination="47" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Obteniendo información de la respuesta</h1>
<p>El objeto de respuesta tiene muchos miembros interesantes, como lo son:</p>
<ul>
<li><code>status_code</code>: Código de estado HTTP</li>
<li><code>headers</code>: Diccionario con las cabeceras de la respuesta</li>
<li><code>cookies</code>: Diccionario con las cookies de la respuesta</li>
<li><code>content</code>: Contenido de la respuesta</li>
<li><code>encoding</code>: Codificación de la respuesta (se puede establecer)</li>
<li><code>text</code>: Contenido de la respuesta en formato texto (decodificado)</li>
<li><code>history</code>: Información de todas las redirecciones que han ocurrido
<ul>
<li>Aunque se puede especificar <code>allow_redirects = False</code> para evitar redirecciones</li>
</ul>
</li>
<li><code>json()</code>: Contenido de la respuesta en formato JSON</li>
<li><code>raise_for_status()</code>: Lanza una excepción si el código de estado no es 200</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="etsisi" data-marpit-pagination="48" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Cómo se pueden especifican las cabeceras?</h1>
<p>Cualquier método de petición acepta un parámetro <code>headers</code>:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>response = requests.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, headers={
    <span class="hljs-string">&#x27;Accept&#x27;</span>: <span class="hljs-string">&#x27;application/json;q=0.9,*/*;q=0.8&#x27;</span>,
    <span class="hljs-string">&#x27;Accept-Encoding&#x27;</span>: <span class="hljs-string">&#x27;gzip, deflate&#x27;</span>,
    <span class="hljs-string">&#x27;Accept-Language&#x27;</span>: <span class="hljs-string">&#x27;en-US, en;q=0.9, es;q=0.8&#x27;</span>
})
response.headers
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="etsisi" data-marpit-pagination="49" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Cómo enviar <em>cookies</em> en una petición?</h1>
<p>Aunque se puede perfectamente con <code>urllib</code>, con <code>requests</code> es mucho más sencillo:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>jar = requests.cookies.RequestsCookieJar()
jar.<span class="hljs-built_in">set</span>(<span class="hljs-string">&#x27;cookie1&#x27;</span>, <span class="hljs-string">&#x27;v1&#x27;</span>, domain=<span class="hljs-string">&#x27;httpbin.org&#x27;</span>, path=<span class="hljs-string">&#x27;/&#x27;</span>)
jar.<span class="hljs-built_in">set</span>(<span class="hljs-string">&#x27;cookie2&#x27;</span>, <span class="hljs-string">&#x27;v2&#x27;</span>, domain=<span class="hljs-string">&#x27;httpbin.org&#x27;</span>, path=<span class="hljs-string">&#x27;/anything&#x27;</span>)
response = requests.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, cookies=jar)
response.text
</span></span></foreignObject></svg></code></pre>
<blockquote>
<p><sup>5</sup> De hecho, trabajar con el objeto <code>CookieJar</code> de <code>urllib</code> es bastante pesado, por eso ni lo comentamos</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="etsisi" data-marpit-pagination="50" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Cómo mantener sesiones?</h1>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>session = requests.Session()
session.get(<span class="hljs-string">&#x27;https://httpbin.org/cookies/set?cookie1=val1&#x27;</span>)
session.get(<span class="hljs-string">&#x27;https://httpbin.org/cookies/set?cookie2=val2&#x27;</span>)
response = session.get(<span class="hljs-string">&#x27;https://httpbin.org/cookies&#x27;</span>)
response.text
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="etsisi" data-marpit-pagination="51" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Autenticación</h1>
<p>La biblioteca permite autenticarse con varios métodos:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>auth = HTTPBasicAuth(<span class="hljs-string">&#x27;user&#x27;</span>, <span class="hljs-string">&#x27;passwd&#x27;</span>)  <span class="hljs-comment"># HTTPDigestAuth, HTTPProxyAuth, ...</span>
<span class="hljs-comment"># auth = </span>
response = requests.get(<span class="hljs-string">&#x27;https://httpbin.org/hidden-basic-auth/user/passwd&#x27;</span>, auth=auth)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="etsisi" data-marpit-pagination="52" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Cómo podemos usar <em>proxies</em>?</h1>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>proxies={<span class="hljs-string">&#x27;http&#x27;</span>: <span class="hljs-string">&#x27;http://ip:puerto&#x27;</span>, <span class="hljs-string">&#x27;https&#x27;</span>: <span class="hljs-string">&#x27;https://ip:puerto})
requests.get(&#x27;</span>https://httpbin.org/anything<span class="hljs-string">&#x27;, proxies=proxies)
</span></span></span></foreignObject></svg></code></pre>
<p>Para mantenerlos en una sesión, se puede hacer de la siguiente forma:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>proxies = {<span class="hljs-string">&#x27;http&#x27;</span>: <span class="hljs-string">&#x27;http://ip:puerto&#x27;</span>, <span class="hljs-string">&#x27;https&#x27;</span>: <span class="hljs-string">&#x27;https://ip:puerto&#x27;</span>}
session = requests.Session()
session.proxies.update(proxies)
session.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="etsisi" data-marpit-pagination="53" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1><i>BONUS TRACK</i>: Peticiones a través de <a href="https://www.torproject.org/">Tor</a></h1>
<p>Podemos usar los proxies configurados para navegar a través de Tor:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>proxies = {
  <span class="hljs-string">&#x27;http&#x27;</span>: <span class="hljs-string">&#x27;socks5://127.0.0.1:9050&#x27;</span>,
  <span class="hljs-string">&#x27;https&#x27;</span>: <span class="hljs-string">&#x27;socks5://127.0.0.1:9050&#x27;</span>
}
requests.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>, proxies=proxies)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="etsisi" data-marpit-pagination="54" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Extrayendo información: expresiones regulares</h1>
<p>Mecanismo compacto para definir patrones de texto que queremos localizar o extraer.</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">import</span> re
texto = <span class="hljs-string">&#x27;ababcababcab&#x27;</span>
patron = <span class="hljs-string">&#x27;a(.*?)c&#x27;</span>  <span class="hljs-comment"># el &#x27;?&#x27; hace el encaje &quot;no voraz&quot;</span>
<span class="hljs-keyword">if</span> m := re.search(patron, texto):
    <span class="hljs-built_in">print</span>(m.group(<span class="hljs-number">1</span>))
</span></span></foreignObject></svg></code></pre>
<ul>
<li><code>re.findall(patron, texto)</code> devuelve <strong>todas</strong> las coincidencias</li>
<li>Flags útiles: <code>re.DOTALL</code>, <code>re.MULTILINE</code>, <code>re.IGNORECASE</code></li>
<li>Si se va a reutilizar mucho, conviene compilar la expresión: <code>re.compile(patron)</code></li>
<li>Herramientas online como <a href="https://regex101.com">regex101.com</a> ayudan a depurar patrones complejos</li>
</ul>
<p><strong><img class="emoji" draggable="false" alt="⚠️" src="https://twemoji.maxcdn.com/2/svg/26a0.svg" data-marp-twemoji=""/> Aviso importante</strong>: las expresiones regulares son frágiles ante HTML real (anidamiento, atributos en cualquier orden). Úsalas para texto simple, no para &quot;parsear&quot; HTML completo — para eso están XPath y los selectores CSS.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="etsisi" data-marpit-pagination="55" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Qué pasa si buscamos muchos patrones?</h1>
<p>Pues que usaremos <code>findall</code> en lugar de <code>search</code></p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>texto = <span class="hljs-string">&#x27;ababcababcab&#x27;</span>
patron = <span class="hljs-string">&#x27;a(.*?)c&#x27;</span>
<span class="hljs-built_in">print</span>(re.findall(patron, texto))
</span></span></foreignObject></svg></code></pre>
<p>En lugar de un objeto <code>match</code> nos devuelve una lista de cadenas</p>
<ul>
<li>Hay <i>flags</i> que vienen bien porque modifican el comporamiento de los metacaracteres:
<ul>
<li><code>re.DOTALL</code>: <code>.</code> coincide con cualquier carácter, incluido el salto de línea <code>\n</code></li>
<li><code>re.MULTILINE</code>: <code>^</code> coincidirá con el comienzo de línea y <code>$</code> con el final de línea</li>
<li><code>re.IGNORECASE</code>: Hace que las expresiones regulares sean insensibles a mayúsculas y minúsculas</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="etsisi" data-marpit-pagination="56" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Ganando eficiencia con expresiones regulares</h1>
<p>Las expresiones regulares se compilan para ejecutarse sobre un texto</p>
<ul>
<li>Cada vez que usamos uno de sus métodos (e.g. <code>search</code>, <code>findall</code>, ...) compilamos la expresión</li>
</ul>
<p>Es recomendable compilar una expresión previamente si la vamos a usar mucho</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>expr = re.<span class="hljs-built_in">compile</span>(<span class="hljs-string">&#x27;a(.*?)c&#x27;</span>)
expr.search(<span class="hljs-string">&#x27;ababcababcab&#x27;</span>)
expr.findall(<span class="hljs-string">&#x27;ababcababcab&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="etsisi" data-marpit-pagination="57" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Algunos consejos</h1>
<p>Para extraer varios valores es muy cómodo dividir la cadena de la expresión en trozos</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>xtr = <span class="hljs-string">&#x27;.*?&lt;a href=“(.*?)&quot;&#x27;</span> <span class="hljs-comment"># url</span>
xtr += <span class="hljs-string">&#x27;.*?&lt;td&gt;(.*?)&lt;/td&gt;&#x27;</span> <span class="hljs-comment"># incidencia</span>
</span></span></foreignObject></svg></code></pre>
<p>Hay herramientas online que ayudan a explicar los patrones que necesitamos</p>
<ul>
<li>&lt;<a href="http://www.regex101.com">www.regex101.com</a>&gt;</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="etsisi" data-marpit-pagination="58" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1><code>BeautifulSoup</code> y selectores CSS</h1>
<p><code>BeautifulSoup</code> es la biblioteca más popular para parsear HTML de forma tolerante a errores, usando selectores CSS de forma muy legible.</p>
<pre><code class="language-bash"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>pip install beautifulsoup4
</span></span></foreignObject></svg></code></pre>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">import</span> requests
<span class="hljs-keyword">from</span> bs4 <span class="hljs-keyword">import</span> BeautifulSoup

page = requests.get(<span class="hljs-string">&#x27;https://httpbin.org&#x27;</span>)
soup = BeautifulSoup(page.content, <span class="hljs-string">&#x27;html.parser&#x27;</span>)

titulo = soup.select_one(<span class="hljs-string">&#x27;title&#x27;</span>).text
enlaces = [a[<span class="hljs-string">&#x27;href&#x27;</span>] <span class="hljs-keyword">for</span> a <span class="hljs-keyword">in</span> soup.select(<span class="hljs-string">&#x27;a[href]&#x27;</span>)]
</span></span></foreignObject></svg></code></pre>
<p>Es la opción recomendada cuando el HTML no está perfectamente formado</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="etsisi" data-marpit-pagination="59" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Extrayendo información: XPath con <code>lxml</code></h1>
<p>Cuando se necesita más precisión o rendimiento, <code>lxml</code> junto con XPath es una alternativa muy potente.</p>
<pre><code class="language-bash"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>pip install lxml
</span></span></foreignObject></svg></code></pre>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">import</span> requests
<span class="hljs-keyword">from</span> lxml <span class="hljs-keyword">import</span> html

page = requests.get(<span class="hljs-string">&#x27;https://httpbin.org&#x27;</span>)
tree = html.fromstring(page.content)
titulo = tree.xpath(<span class="hljs-string">&#x27;//title/text()&#x27;</span>)

<span class="hljs-comment"># Ejemplo: títulos de noticias de un portal</span>
page = requests.get(<span class="hljs-string">&#x27;https://www.bbc.com/news&#x27;</span>)
tree = html.fromstring(page.content)
noticias = tree.xpath(<span class="hljs-string">&#x27;//a[@class=&quot;gs-c-block-link__overlay-link&quot;]/text()&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="etsisi" data-marpit-pagination="60" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>El framework Scrapy</h1>
<p>Cuando el proyecto crece (miles de páginas, varios sitios, necesidad de programar reintentos y exportación), conviene un framework dedicado en lugar de scripts sueltos.</p>
<p><strong>Scrapy</strong> organiza el scraping en torno a tres conceptos:</p>
<ul>
<li><strong>Spiders</strong>: definen cómo navegar un sitio y qué datos extraer de cada página</li>
<li><strong>Pipelines</strong>: procesan y almacenan los datos extraídos (limpieza, validación, guardado en base de datos)</li>
<li><strong>Middlewares</strong>: interceptan peticiones/respuestas para añadir comportamiento transversal (proxies, reintentos, rotación de <em>user-agent</em>)</li>
</ul>
<p>Incluye de serie gestión de concurrencia, colas de peticiones y respeto configurable de <code>robots.txt</code> — todo lo que en los ejemplos anteriores tendríamos que programar a mano.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="etsisi" data-marpit-pagination="61" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>El framework Scrapy</h1>
<center>
<p><img src="images/t4/Scrapy_Architecture.png" alt="" style="width:700px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://docs.scrapy.org/en/0.22/topics/architecture.html">https://docs.scrapy.org/en/0.22/topics/architecture.html</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="62" data-marpit-pagination-total="96" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Herramientas para scraping dinámico</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="etsisi" data-marpit-pagination="63" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Por qué necesitamos un navegador?</h1>
<p>Cuando el contenido se genera con JavaScript <strong>después</strong> de la carga inicial, descargar el HTML crudo no sirve: hay que <strong>ejecutar</strong> la página como lo haría un navegador.</p>
<p>Para esto existen los <strong>navegadores headless</strong>: un navegador real, pero sin interfaz gráfica, controlado por código.</p>
<ul>
<li>Es de las pocas formas fiables de interpretar código del lado del cliente dentro de un softbot</li>
<li>Es más lento y consume más recursos que las técnicas anteriores</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="etsisi" data-marpit-pagination="64" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>La biblioteca <code>selenium</code></h1>
<p>Nació como entorno de pruebas para aplicaciones web, pero hoy se usa ampliamente como herramienta de scraping dinámico.</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">from</span> selenium <span class="hljs-keyword">import</span> webdriver
<span class="hljs-keyword">from</span> selenium.webdriver.common.by <span class="hljs-keyword">import</span> By

driver = webdriver.Firefox()
driver.get(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)

elemento = driver.find_element(By.ID, <span class="hljs-string">&#x27;id&#x27;</span>)
elemento = driver.find_element(By.CSS_SELECTOR, <span class="hljs-string">&#x27;selector&#x27;</span>)
elemento = driver.find_element(By.XPATH, <span class="hljs-string">&#x27;//etiqueta[@atributo=&quot;valor&quot;]&#x27;</span>)
</span></span></foreignObject></svg></code></pre>
<ul>
<li><code>find_element</code>: primer elemento que cumple el criterio</li>
<li><code>find_elements</code>: lista de todos los elementos que lo cumplen</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="etsisi" data-marpit-pagination="65" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Interactuar con la página</h1>
<p>Al emular un navegador real, podemos reproducir cualquier acción humana:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>boton.click()
campo_texto.send_keys(<span class="hljs-string">&#x27;texto&#x27;</span>)
formulario.submit()
</span></span></foreignObject></svg></code></pre>
<p>Y esperar a que ocurran cosas de forma explícita, en lugar de usar pausas fijas:</p>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">from</span> selenium.webdriver.support.ui <span class="hljs-keyword">import</span> WebDriverWait
<span class="hljs-keyword">from</span> selenium.webdriver.support <span class="hljs-keyword">import</span> expected_conditions <span class="hljs-keyword">as</span> EC

elemento = WebDriverWait(driver, <span class="hljs-number">10</span>).until(
    EC.presence_of_element_located((By.ID, <span class="hljs-string">&#x27;id&#x27;</span>))
)
</span></span></foreignObject></svg></code></pre>
</section>
