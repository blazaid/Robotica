</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="etsisi" data-marpit-pagination="66" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1><code>Playwright</code> como alternativa</h1>
<p><strong>Selenium</strong> sigue siendo el más veterano y extendido, pero <strong>Playwright</strong> (Microsoft) se ha consolidado como alternativa moderna con ventajas notables:</p>
<ul>
<li>Espera automática de elementos (menos necesidad de <code>WebDriverWait</code> manual)</li>
<li>API más consistente entre Chromium, Firefox y WebKit</li>
<li>Mejor soporte nativo para interceptar peticiones de red y depurar</li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">from</span> playwright.sync_api <span class="hljs-keyword">import</span> sync_playwright

<span class="hljs-keyword">with</span> sync_playwright() <span class="hljs-keyword">as</span> p:
    browser = p.chromium.launch(headless=<span class="hljs-literal">True</span>)
    page = browser.new_page()
    page.goto(<span class="hljs-string">&#x27;https://httpbin.org/anything&#x27;</span>)
    enlaces = [a.get_attribute(<span class="hljs-string">&#x27;href&#x27;</span>) <span class="hljs-keyword">for</span> a <span class="hljs-keyword">in</span> page.query_selector_all(<span class="hljs-string">&#x27;a&#x27;</span>)]
</span></span></foreignObject></svg></code></pre>
<p>Para proyectos nuevos en 2026, Playwright es una opción interesante</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="etsisi" data-marpit-pagination="67" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Extracción asistida por IA</h1>
<p>Una tendencia reciente es usar un <strong>LLM</strong> para interpretar el contenido de una página en lugar de escribir selectores CSS/XPath frágiles a mano:</p>
<ul>
<li>El HTML (o una versión simplificada) se pasa al modelo junto con una instrucción de qué extraer</li>
<li>Es especialmente útil frente a páginas que cambian de estructura con frecuencia, o con contenido semi-estructurado (opiniones, descripciones libres)</li>
<li>Servicios especializados combinan esta idea con infraestructura de scraping (proxies rotativos, renderizado JS, resolución de CAPTCHAs) empaquetada como API</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="etsisi" data-marpit-pagination="68" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Buenas prácticas técnicas</h1>
<p>Un scraper bien construido:</p>
<ul>
<li>Respeta un <strong>intervalo entre peticiones</strong> (rate limiting propio), a ser posible con variación aleatoria</li>
<li>Usa un <strong>user-agent realista y actualizado</strong></li>
<li>Maneja <strong>errores de red y reintentos</strong> con criterio (no reintentar infinitamente, usar <em>backoff</em> progresivo)</li>
<li><strong>Cachea</strong> lo que ya ha descargado para no repetir trabajo innecesario</li>
<li>Usa <strong>API cuando existe</strong>, y reserva el scraping para lo que realmente lo necesita</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="etsisi" data-marpit-pagination="69" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Mecanismos anti-scraping</h1>
<p>Es lógico que algunos sitios protejan sus datos. Ninguna medida es infalible, casi todo comportamiento de navegador es replicable, pero sí dificultan la tarea:</p>
<ul>
<li><strong>Análisis de comportamiento</strong>: detectar patrones no humanos (velocidad, regularidad de clics)</li>
<li><strong>Bloqueo de IP</strong>: bloquear direcciones que acceden con demasiada frecuencia</li>
<li><strong>CAPTCHA</strong>: <em>Completely Automated Public Turing test to tell Computers and Humans Apart</em></li>
<li><strong><code>robots.txt</code></strong>: fichero que indica qué rutas no deberían visitar los robots</li>
<li><strong>HoneyPot</strong>: enlaces trampa invisibles para humanos pero visibles para un scraper poco cuidadoso</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="etsisi" data-marpit-pagination="70" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Técnicas (legítimas) para evitar bloqueos</h1>
<ul>
<li><strong>Rotación de user-agent</strong> entre sesiones (manteniéndolo fijo dentro de una misma sesión)</li>
<li><strong>Intervalos aleatorios</strong> entre peticiones, proporcionales al volumen de contenido pedido</li>
<li><strong>User-agents actualizados</strong></li>
<li><strong>Proxies</strong> para distribuir la carga entre varias IPs</li>
<li><strong>Navegadores headless</strong> cuando la interpretación de JavaScript es imprescindible</li>
<li><strong>Evitar honeypots</strong>: no seguir enlaces ocultos o sin sentido visual</li>
<li><strong>Respetar <code>robots.txt</code></strong></li>
<li><strong>Usar la API oficial</strong> cuando exista, en lugar de scrapear</li>
<li>Ordenar las cabeceras de forma similar a como lo hace un navegador real</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="etsisi" data-marpit-pagination="71" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1><code>robots.txt</code> y los nuevos estándares para la era de la IA</h1>
<p><code>robots.txt</code> (estandarizado como RFC 9309) es una <strong>petición voluntaria</strong> que los rastreadores de buena fe respetan<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></svg></mjx-container>, el cumplimiento real ocurre a nivel de servidor o CDN.</p>
<p>Últimamente han surgido señales adicionales pensadas específicamente para agentes de IA:</p>
<ul>
<li>Diferenciación entre rastreadores de <strong>búsqueda</strong> (e.g. <code>OAI-SearchBot</code>) y de <strong>entrenamiento</strong> (e.g. <code>GPTBot</code>, <code>Google-Extended</code>), que un sitio puede permitir o bloquear por separado</li>
<li>Propuestas de <strong><code>ai.txt</code> / <code>llms.txt</code></strong>, pensadas para expresar matices que <code>robots.txt</code> no puede (por ejemplo, &quot;indexa esto, pero no lo uses para entrenar un modelo&quot;)</li>
</ul>
<blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></svg></mjx-container>: No tiene fuerza legal por sí mismo y no bloquea el acceso técnicamente</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="etsisi" data-marpit-pagination="72" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>¿Es legal el web scraping?</h1>
<p>Sigue moviéndose en una zona intermedia entre lo permitido y lo prohibido, y depende mucho del contexto:</p>
<ul>
<li>El scraping de páginas <strong>públicas</strong>, en sí mismo, generalmente no se considera un acceso no autorizado</li>
<li>Pero <strong>las condiciones de uso que se aceptan</strong> (por ejemplo, al crear una cuenta) sí pueden ser exigibles por contrato, aunque los datos scrapeados sean públicos</li>
<li>El tratamiento de <strong>datos personales</strong> añade otra capa: en la Unión Europea, el RGPD aplica independientemente de que el dato esté &quot;públicamente accesible&quot;</li>
<li>En España, la Ley de Servicios de la Sociedad de la Información (LSSI-CE) no prohíbe explícitamente el web scraping</li>
</ul>
<blockquote>
<p><em>I am not a lawyer</em> (IANAL), esto es una introducción para orientarte, no asesoramiento legal.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="etsisi" data-marpit-pagination="73" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Jurisprudencia y marco 2026</h1>
<p>Dos referencias que conviene conocer:</p>
<ul>
<li><strong>hiQ Labs v. LinkedIn</strong>: hiQ scrapeaba perfiles públicos de LinkedIn con fines de analítica de RRHH. El Noveno Circuito de EE. UU. resolvió (2022) que scrapear páginas públicas <strong>no</strong> constituye un acceso no autorizado bajo la CFAA, pero el caso terminó con hiQ reconociendo haber <strong>incumplido los términos de servicio</strong> que sí había aceptado. La lección de doble filo: scrapear lo público no es &quot;hackear&quot;, pero los contratos que aceptas sí son exigibles</li>
<li><strong>Reglamento de IA de la UE (EU AI Act)</strong>: desde 2026 exige a los proveedores de IA de propósito general documentar las fuentes de sus datos de entrenamiento y respetar las señales de exclusión de minería de texto y datos (<em>TDM opt-out</em>)</li>
</ul>
<p>En 2026, la tendencia regulatoria es clara: pasar del &quot;salvaje oeste&quot; de la extracción de datos a exigir <strong>trazabilidad y base legal documentada</strong>, especialmente en la UE.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="etsisi" data-marpit-pagination="74" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>El nuevo panorama: agentes de IA frente a plataformas</h1>
<p>Antes de 2024, el acceso automatizado a la web se regulaba de facto mediante dos mecanismos: la adhesión voluntaria a <code>robots.txt</code>, y técnicas de identificación de clientes automatizados</p>
<p>Con la llegada de agentes de IA que navegan y actúan de forma autónoma a gran escala, ese equilibrio se ha vuelto inestable, hay quien lo describe como una auténtica <strong>carrera armamentística</strong> entre plataformas y proveedores de agentes, apoyada todavía en precedentes legales pensados para el scraping tradicional, no para agentes autónomos. Esto está impulsando propuestas de una <strong>nueva infraestructura normativa</strong> específica para lo que ya se conoce como la <em>web agéntica</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="75" data-marpit-pagination-total="96" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Bloque 3</h1>
<h2>Softbots</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="etsisi" data-marpit-pagination="76" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Recordatorio: ¿qué es un softbot?</h1>
<p>Un <strong>softbot</strong> es un robot software que actúa en nombre de un usuario o proceso, usado para automatizar tareas repetitivas y tediosas.</p>
<p>Con todo lo visto, podemos concretarlo mucho más:</p>
<ul>
<li>Su <strong>percepción</strong> del entorno ocurre a través de servicios web (APIs) o de web scraping</li>
<li>Su <strong>acción</strong> sobre el entorno ocurre también a través de esos mismos canales: llamadas a una API, envío de formularios, clics en una interfaz</li>
<li>Su <strong>arquitectura interna</strong> (reactiva, deliberativa, híbrida, BDI, basada en LLM...) decide qué hacer con lo percibido</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="etsisi" data-marpit-pagination="77" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Softbot</h1>
<center>
<p><img src="images/t4/AgentEnvironment_Softbot.png" alt="" style="width:1000px;" /></p>
</center>
<blockquote>
<p>Fuente (editada): <a href="https://www.researchgate.net/publication/201018712_Towards_a_Unified_View_of_the_Environments_within_Multi-Agent_Systems">https://www.researchgate.net/publication/201018712_Towards_a_Unified_View_of_the_Environments_within_Multi-Agent_Systems</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-theme="etsisi" data-marpit-pagination="78" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Ciclo de vida típico de un softbot</h1>
<ol>
<li><strong>Inicialización</strong>: carga de configuración, credenciales, estado previo si existe</li>
<li><strong>Percepción</strong>: consulta a una API, scraping de una o varias páginas</li>
<li><strong>Decisión</strong>: procesamiento de lo percibido según su arquitectura interna</li>
<li><strong>Acción</strong>: llamada a una API, envío de un formulario, notificación, escritura en una base de datos</li>
<li><strong>Persistencia</strong>: guardar el nuevo estado para la siguiente ejecución</li>
<li><strong>Repetición o finalización</strong>, según el patrón de ejecución</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-theme="etsisi" data-marpit-pagination="79" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Taxonomía de softbots según su función</h1>
<ul>
<li><strong>De recolección de información</strong>: agregadores de noticias, comparadores de precios</li>
<li><strong>De monitorización</strong>: vigilar disponibilidad, cambios de precio, menciones de marca</li>
<li><strong>De interacción transaccional</strong>: rellenar formularios, realizar compras o reservas automatizadas</li>
<li><strong>De asistencia conversacional</strong>: chatbots y asistentes que combinan percepción externa con generación de lenguaje natural</li>
</ul>
<p>Esta taxonomía no es excluyente: muchos softbots reales combinan varias de estas funciones a la vez.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="80" data-marpit-pagination-total="96" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Bloque 4</h1>
<h2>Programación de softbots</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-theme="etsisi" data-marpit-pagination="81" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Patrones de ejecución: polling vs. eventos</h1>
<p>Dos formas fundamentales de organizar cuándo actúa un softbot:</p>
<ul>
<li><strong>Polling (sondeo)</strong>: el softbot pregunta periódicamente &quot;¿ha cambiado algo?&quot;, simple de implementar, pero ineficiente si los cambios son poco frecuentes</li>
<li><strong>Orientado a eventos (webhooks)</strong>: el softbot espera pasivamente a que le avisen cuando algo ocurre — más eficiente, pero requiere que el servicio externo lo soporte y que el softbot exponga un punto de recepción</li>
</ul>
<p>La elección condiciona directamente la arquitectura: un softbot por <em>polling</em> se parece a un bucle reactivo simple; uno orientado a eventos se parece más a un sistema dirigido por mensajes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-theme="etsisi" data-marpit-pagination="82" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Webhooks vs Polling</h1>
<blockquote>
<p>Fuente: <a href="https://www.prakashbhandari.com.np/posts/polling-vs-webhooks/">https://www.prakashbhandari.com.np/posts/polling-vs-webhooks/</a></p>
</blockquote>
<center>
<p><img src="https://www.prakashbhandari.com.np/images/posts/polling-vs-webhooks/polling-vs-webhooks.svg" alt="" style="width:800px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-theme="etsisi" data-marpit-pagination="83" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Programación de tareas</h1>
<p>Cuando el softbot debe ejecutarse de forma periódica, se usan planificadores:</p>
<ul>
<li><strong><code>cron</code></strong> (Linux) o el Programador de tareas (Windows) para ejecuciones a nivel de sistema operativo</li>
<li>Bibliotecas de planificación dentro de la propia aplicación (p. ej. <code>APScheduler</code> en Python), útiles cuando el softbot necesita gestionar su propio calendario de tareas con lógica más compleja</li>
</ul>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-comment"># Ejemplo con APScheduler</span>
<span class="hljs-keyword">from</span> apscheduler.schedulers.blocking <span class="hljs-keyword">import</span> BlockingScheduler

scheduler = BlockingScheduler()
scheduler.add_job(revisar_precios, <span class="hljs-string">&#x27;interval&#x27;</span>, hours=<span class="hljs-number">1</span>)
scheduler.start()
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-theme="etsisi" data-marpit-pagination="84" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Programación asíncrona</h1>
<p>Un softbot suele hacer <strong>muchas</strong> peticiones de red, y cada una implica esperar. Ejecutarlas de una en una es lento e ineficiente.</p>
<ul>
<li>La programación <strong>asíncrona</strong> permite lanzar varias peticiones y seguir trabajando mientras se espera la respuesta</li>
<li>En Python, esto se implementa con <code>asyncio</code> y bibliotecas compatibles como <code>aiohttp</code> o <code>httpx</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-theme="etsisi" data-marpit-pagination="85" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Programación asíncrona: asyncio y httpx</h1>
<pre><code class="language-python"><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap><span class="hljs-keyword">import</span> asyncio, httpx

<span class="hljs-keyword">async</span> <span class="hljs-function"><span class="hljs-keyword">def</span> <span class="hljs-title">obtener</span>(<span class="hljs-params">cliente, url</span>):</span>
    respuesta = <span class="hljs-keyword">await</span> cliente.get(url)
    <span class="hljs-keyword">return</span> respuesta.json()

<span class="hljs-keyword">async</span> <span class="hljs-function"><span class="hljs-keyword">def</span> <span class="hljs-title">main</span>():</span>
    <span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> httpx.AsyncClient() <span class="hljs-keyword">as</span> cliente:
        tareas = [obtener(cliente, url) <span class="hljs-keyword">for</span> url <span class="hljs-keyword">in</span> urls]
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">await</span> asyncio.gather(*tareas)
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-theme="etsisi" data-marpit-pagination="86" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Gestión segura de credenciales</h1>
<p>Las claves de API, contraseñas o tokens <strong>nunca</strong> deben:</p>
<ul>
<li>Escribirse directamente en el código fuente</li>
<li>Subirse a un repositorio de control de versiones</li>
</ul>
<p>En su lugar:</p>
<ul>
<li><strong>Variables de entorno</strong></li>
<li><strong>Ficheros de configuración</strong> excluidos del repositorio (<code>.gitignore</code>)</li>
<li><strong>Gestores de secretos</strong> dedicados en entornos de producción (Vault, AWS Secrets Manager, etc.)</li>
</ul>
<p>Esto conecta con el <strong>principio de mínimo privilegio</strong>: un softbot debe tener acceso solo a lo estrictamente necesario para su tarea.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-theme="etsisi" data-marpit-pagination="87" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Buenas prácticas de diseño para un softbot</h1>
<ul>
<li><strong>Principio de mínimo privilegio</strong>: solo los permisos y accesos estrictamente necesarios</li>
<li><strong>Límites de tasa propios</strong>, aunque el servicio externo no los exija explícitamente</li>
<li><strong>Transparencia</strong>: identificarse honestamente (user-agent, cabeceras) en lugar de disfrazarse como humano cuando no hace falta</li>
<li><strong>Respeto a los términos de servicio</strong> del sitio o API con el que se interactúa</li>
<li><strong>Degradación controlada</strong>: que un fallo parcial no tumbe todo el softbot</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="88" data-marpit-pagination-total="96" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Bloque 5</h1>
<h2>Caso práctico</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-theme="etsisi" data-marpit-pagination="89" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Ejemplo: monitor de precios</h1>
<p>Diseñemos, a alto nivel, un softbot que vigile el precio de un producto y avise cuando baje de un umbral:</p>
<ol>
<li><strong>Percepción</strong>: cada hora (<code>cron</code>/<code>APScheduler</code>), consulta la API del comercio si existe; si no, hace scraping de la página del producto con <code>requests</code> + <code>BeautifulSoup</code></li>
<li><strong>Decisión</strong>: arquitectura reactiva simple: «si precio actual &lt; umbral, notificar» (se podría sofisticar con una arquitectura BDI si quisiéramos gestionar varios productos con distintas prioridades)</li>
<li><strong>Acción</strong>: envío de una notificación (correo, API de mensajería)</li>
<li><strong>Persistencia</strong>: guarda el último precio visto en una base de datos ligera, para poder calcular tendencias</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-theme="etsisi" data-marpit-pagination="90" data-marpit-pagination-total="96" style="--paginate:true;--theme:etsisi;">
<h1>Recorriendo el ciclo percepción-decisión-acción</h1>
<table>
<thead>
<tr>
<th>Fase</th>
<th>Bloque 1/4.1</th>
<th>Implementación en este caso</th>
</tr>
</thead>
<tbody>
<tr>
<td>Percepción</td>
<td>API o scraping</td>
<td><code>requests</code> + <code>BeautifulSoup</code>, o llamada REST</td>
</tr>
<tr>
<td>Decisión</td>
<td>Arquitectura (4.1)</td>
<td>Regla condición-acción (reactiva)</td>
</tr>
<tr>
<td>Acción</td>
<td>Actuador</td>
<td>Envío de email / API de notificaciones</td>
</tr>
<tr>
<td>Persistencia</td>
<td>Estado (Bloque 4)</td>
<td>Base de datos SQLite</td>
</tr>
<tr>
<td>Robustez</td>
<td>Manejo de errores (Bloque 4)</td>
<td>Reintentos con backoff si el sitio no responde</td>
</tr>
</tbody>
</table>
<p>Este ejemplo, aunque sencillo, contiene ya todos los elementos que hemos visto</p>
</section>
