<h1>El Tema 4: Robótica software</h1>
<p>Este tema cierra la asignatura y se compone de tres bloques encadenados:</p>
<ul>
<li><strong>4.1. Arquitecturas de robots software</strong>: cómo se organiza un agente software por dentro</li>
<li><strong>4.2. Programación de softbots</strong>: cómo se implementa un agente en la práctica, incluyendo <em>web scraping</em></li>
<li><strong>4.3. Robotic Process Automation (RPA)</strong>: cómo se industrializa esta idea para automatizar procesos de negocio reales</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="etsisi" data-marpit-pagination="3" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Objetivos de aprendizaje de hoy</h1>
<p>Al finalizar esta sesión serás capaz de:</p>
<ul>
<li>Definir formalmente qué es un agente y qué lo hace racional</li>
<li>Distinguir las grandes familias de arquitecturas de agentes y sus compromisos de diseño</li>
<li>Identificar arquitecturas concretas de referencia (subsunción, BDI, 3 capas...) y cuándo usar cada una</li>
<li>Relacionar las arquitecturas clásicas con los agentes modernos basados en modelos de lenguaje (LLM)</li>
<li>Entender por qué la arquitectura interna de un softbot condiciona todo lo que veremos en 4.2 y 4.3</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="4" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="etsisi" data-marpit-pagination="5" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>¿Qué es un agente?</h1>
<p>Un <strong>agente</strong> es cualquier entidad capaz de:</p>
<ul>
<li><strong>Percibir</strong> su entorno a través de <strong>sensores</strong></li>
<li><strong>Actuar</strong> sobre ese entorno a través de <strong>actuadores</strong></li>
<li>Hacerlo de manera <strong>autónoma</strong>, es decir, sin intervención humana directa en cada decisión</li>
<li>Con el fin de <strong>alcanzar uno o varios objetivos</strong></li>
</ul>

131 572 113 518Q102 502 80 490T37 475Z"></path></g></g><g data-mml-node="mo" transform="translate(817.9,413) scale(0.707)"><path data-c="2217" d="M229 286Q216 420 216 436Q216 454 240 464Q241 464 245 464T251 465Q263 464 273 456T283 436Q283 419 277 356T270 286L328 328Q384 369 389 372T399 375Q412 375 423 365T435 338Q435 325 425 315Q420 312 357 282T289 250L355 219L425 184Q434 175 434 161Q434 146 425 136T401 125Q393 125 383 131T328 171L270 213Q283 79 283 63Q283 53 276 44T250 35Q231 35 224 44T216 63Q216 80 222 143T229 213L171 171Q115 130 110 127Q106 124 100 124Q87 124 76 134T64 161Q64 166 64 169T67 175T72 181T81 188T94 195T113 204T138 215T170 230T210 250L74 315Q65 324 65 338Q65 353 74 363T98 374Q106 374 116 368T171 328L229 286Z"></path></g></g><g data-mml-node="mo" transform="translate(2882.7,0)"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(4160.5,0)"><g data-mml-node="mi"><path data-c="41" d="M576 668Q576 688 606 708T660 728Q676 728 675 712V571Q675 409 688 252Q696 122 720 57Q722 53 723 50T728 46T732 43T737 41T743 39L754 45Q788 61 803 61Q819 61 819 47Q818 43 814 35Q799 15 755 -7T675 -30Q659 -30 648 -25T630 -8T621 11T614 34Q603 77 599 106T594 146T591 160V163H460L329 164L316 145Q241 35 196 -7T119 -50T59 -24T30 43Q30 75 46 100T74 125Q81 125 83 120T88 104T96 84Q118 57 151 57Q189 57 277 182Q432 400 542 625L559 659H567Q574 659 575 660T576 668ZM584 249Q579 333 577 386T575 473T574 520V581L563 560Q497 426 412 290L372 228L370 224H371L383 228L393 232H586L584 249Z"></path></g></g></g></g></svg></mjx-container></p><ul>
<li>El agente recibe <strong>percepciones</strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.129ex" xmlns="http://www.w3.org/2000/svg" width="2.763ex" height="1.694ex" role="img" focusable="false" viewBox="0 -691.8 1221.4 748.8"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="50" d="M37 475Q19 475 19 487Q19 536 103 604T327 682Q329 682 344 682T380 682T421 683H463Q625 683 695 615Q718 591 726 564Q733 547 733 525Q733 412 607 312T321 205H312Q293 205 293 217Q293 224 302 236T333 260T385 274Q558 287 614 407Q633 445 633 477Q633 515 612 543T556 585T481 607T399 614H370L368 603Q352 463 312 312T242 82T202 -13Q190 -33 164 -45T121 -57Q108 -57 108 -45Q108 -40 120 -10T151 73T192 190T233 349T266 539Q267 546 269 565T272 598T274 613H270Q209 613 163 588Q131 572 113 518Q102 502 80 490T37 475Z"></path></g></g><g data-mml-node="mo" transform="translate(817.9,363) scale(0.707)"><path data-c="2217" d="M229 286Q216 420 216 436Q216 454 240 464Q241 464 245 464T251 465Q263 464 273 456T283 436Q283 419 277 356T270 286L328 328Q384 369 389 372T399 375Q412 375 423 365T435 338Q435 325 425 315Q420 312 357 282T289 250L355 219L425 184Q434 175 434 161Q434 146 425 136T401 125Q393 125 383 131T328 171L270 213Q283 79 283 63Q283 53 276 44T250 35Q231 35 224 44T216 63Q216 80 222 143T229 213L171 171Q115 130 110 127Q106 124 100 124Q87 124 76 134T64 161Q64 166 64 169T67 175T72 181T81 188T94 195T113 204T138 215T170 230T210 250L74 315Q65 324 65 338Q65 353 74 363T98 374Q106 374 116 368T171 328L229 286Z"></path></g></g></g></g></svg></mjx-container> del entorno a través de sus sensores</li>
<li>Internamente, procesa esas percepciones según su <strong>programa de agente</strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container></li>
<li>El programa decide qué <strong>acción</strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.113ex" xmlns="http://www.w3.org/2000/svg" width="1.853ex" height="1.76ex" role="img" focusable="false" viewBox="0 -728 819 778"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="41" d="M576 668Q576 688 606 708T660 728Q676 728 675 712V571Q675 409 688 252Q696 122 720 57Q722 53 723 50T728 46T732 43T737 41T743 39L754 45Q788 61 803 61Q819 61 819 47Q818 43 814 35Q799 15 755 -7T675 -30Q659 -30 648 -25T630 -8T621 11T614 34Q603 77 599 106T594 146T591 160V163H460L329 164L316 145Q241 35 196 -7T119 -50T59 -24T30 43Q30 75 46 100T74 125Q81 125 83 120T88 104T96 84Q118 57 151 57Q189 57 277 182Q432 400 542 625L559 659H567Q574 659 575 660T576 668ZM584 249Q579 333 577 386T575 473T574 520V581L563 560Q497 426 412 290L372 228L370 224H371L383 228L393 232H586L584 249Z"></path></g></g></g></g></svg></mjx-container> ejecutar a través de los actuadores</li>
<li>Esa acción modifica el entorno, generando nuevas percepciones y el ciclo se repite</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="etsisi" data-marpit-pagination="8" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>El ciclo agente-entorno</h1>
<p>Este ciclo percepción → decisión → acción es el esqueleto común a <strong>todas</strong> las arquitecturas que veremos hoy. Lo que cambia entre una arquitectura y otra es <strong>cómo se implementa la caja de decisión</strong>.</p>
<center>
<p><img src="images/t4/AgentEnvironment_RealExample.jpg" alt="" style="height:350px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.mdpi.com/2624-8921/8/1/8">https://www.mdpi.com/2624-8921/8/1/8</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="etsisi" data-marpit-pagination="9" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Agente racional</h1>
<p>Un agente es <strong>racional</strong> cuando, para cada secuencia de percepciones posible, selecciona la acción que se espera maximice su <strong>medida de rendimiento</strong>, dado:</p>
<ul>
<li>La evidencia aportada por la secuencia de percepciones hasta el momento</li>
<li>El conocimiento del entorno que el agente posee de antemano</li>
</ul>
<p>Importante: racionalidad <strong>no es lo mismo que omnisciencia</strong></p>
<ul>
<li>Un agente racional puede fallar si el entorno le oculta información</li>
<li>Lo que se le exige es tomar la mejor decisión posible <strong>con lo que sabe</strong>, no adivinar el futuro</li>
</ul>
<blockquote>
<p>Es decir, si no somos capaces de saber cómo de bien lo estamos haciendo, no se pueden tomar decisiones <strong>coherentes</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="etsisi" data-marpit-pagination="10" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Medida de rendimiento</h1>
<p>La <strong>medida de rendimiento</strong> es el criterio externo y objetivo que usamos para evaluar el éxito del comportamiento de un agente.</p>
<ul>
<li>Debe definirse en términos de lo que se quiere lograr <strong>en el entorno</strong>, no de cómo creemos que el agente debería comportarse</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://twemoji.maxcdn.com/2/svg/26a0.svg" data-marp-twemoji=""/> <strong>Ejemplo</strong>: para una aspiradora robótica, &quot;<strong>cantidad de suciedad recogida</strong>&quot; es peor medida que &quot;<strong>limpieza del suelo mantenida en el tiempo con bajo consumo eléctrico y sin daños</strong>&quot; — la primera puede incentivar comportamientos perversos (ensuciar y limpiar en bucle)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="etsisi" data-marpit-pagination="11" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>El marco PEAS</h1>
<p>Para especificar el entorno de trabajo de un agente de forma sistemática se usa el marco <strong>PEAS</strong>:</p>
<table>
<thead>
<tr>
<th>Elemento</th>
<th>Pregunta que responde</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>P</strong>erformance (Rendimiento)</td>
<td>¿Cómo mido el éxito?</td>
</tr>
<tr>
<td><strong>E</strong>nvironment (Entorno)</td>
<td>¿Dónde opera el agente?</td>
</tr>
<tr>
<td><strong>A</strong>ctuators (Actuadores)</td>
<td>¿Cómo actúa?</td>
</tr>
<tr>
<td><strong>S</strong>ensors (Sensores)</td>
<td>¿Cómo percibe?</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="etsisi" data-marpit-pagination="12" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="etsisi" data-marpit-pagination="13" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Por qué importa la arquitectura interna</h1>
<p>Dos agentes pueden tener exactamente el mismo comportamiento observable y, sin embargo, estar construidos de maneras radicalmente distintas por dentro.</p>
<p>La <strong>arquitectura</strong> es precisamente esa organización interna: qué módulos existen, cómo se comunican, y qué mecanismo decide la acción a partir de las percepciones.</p>
<p>La arquitectura elegida determina, entre otras cosas:</p>
<ul>
<li>La <strong>velocidad de reacción</strong> del agente</li>
<li>Su capacidad de <strong>planificar a largo plazo</strong></li>
<li>Su <strong>robustez</strong> ante entornos cambiantes o imprevistos</li>
<li>Su <strong>explicabilidad</strong>: si el agente puede justificar por qué hizo algo</li>
<li>El <strong>coste computacional</strong> de tomar cada decisión</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="etsisi" data-marpit-pagination="14" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">

<h1>Bloque 2</h1>
<h2>Sistemas intencionales</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="etsisi" data-marpit-pagination="16" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>La postura intencional de Dennett</h1>
<p>Un <strong>sistema intencional</strong> es aquel cuyo comportamiento podemos describir y predecir de forma útil atribuyéndole creencias, deseos y racionalidad, aunque no sepamos —o no importe— cómo funciona realmente por dentro (Dennett, 1987)<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>.</p>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>«Bea lleva una cámara porque cree que verá algo interesante»
</span></span></foreignObject></svg></code></pre>
<ul>
<li>No estamos afirmando que <em>Bea</em> tenga literalmente un módulo de &quot;creencia&quot; en el cerebro</li>
<li>Estamos usando ese vocabulario porque <strong>nos permite predecir su comportamiento</strong> de forma más económica que describiendo cada neurona</li>
</ul>
<p>La <strong>postura intencional</strong> (intentional stance) es una de las 3 estrategias que propone Dennett para predecir el comportamiento de un sistema, junto a la postura física y la postura de diseño.</p>
<blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></g></svg></mjx-container>: Yo tampoco me esperaba una cita de un libro de filosofía en la asignatura de robótica</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="etsisi" data-marpit-pagination="17" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>De la filosofía a la ingeniería</h1>
<p>¿Por qué le importa esto a alguien que construye robots software?</p>
<ul>
<li>Porque un agente puede <strong>definirse y especificarse correctamente</strong> mediante posturas intencionales:</li>
</ul>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>&quot;este agente cree que la batería está baja&quot;
&quot;este agente desea completar la tarea&quot;
&quot;este agente tiene la intención de recargar antes de continuar&quot;
</span></span></foreignObject></svg></code></pre>
<ul>
<li>Este vocabulario no es solo una metáfora cómoda: <strong>da lugar directamente a una familia de arquitecturas</strong> que representan explícitamente creencias, deseos e intenciones como estructuras de datos manipulables por el propio agente</li>
</ul>
<p>Todo esto es el equivalente a observar a nuestros agentes como cajas negras donde es <strong>más relevante</strong> entender lo que hacen que el por qué.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="18" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">
<h2>Arquitecturas reactivas</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="etsisi" data-marpit-pagination="19" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arquitecturas reactivas: principio de diseño</h1>
<p>Las arquitecturas <strong>reactivas</strong> responden a los cambios del entorno de forma rápida, <strong>sin</strong> mantener un modelo simbólico interno del mundo ni realizar planificación detallada.</p>
<ul>
<li>Se basan en un conjunto de <strong>reglas condición-acción</strong>: &quot;si percibo X, ejecuto Y&quot;</li>
<li>Interactúan directamente con el entorno, decidiendo en base a la información sensorial <strong>actual</strong> (sin memoria de largo plazo)</li>
<li>Se adaptan bien a entornos <strong>dinámicos e impredecibles</strong></li>
<li>Son especialmente útiles cuando se requieren respuestas en <strong>tiempo real</strong></li>
</ul>
<table>
<thead>
<tr>
<th>Robot</th>
<th>Condición</th>
<th>Acción</th>
</tr>
</thead>
<tbody>
<tr>
<td>Coche autónomo</td>
<td>Viene una curva</td>
<td>Disminuir velocidad</td>
</tr>
<tr>
<td>Industria metalúrgica</td>
<td>Sobrecalentamiento</td>
<td>Encender ventiladores</td>
</tr>
<tr>
<td>Yo en la cama</td>
<td>Suena la alarma</td>
<td>Pulso &quot;Añadir 1 min&quot;</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="etsisi" data-marpit-pagination="20" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>La arquitectura de subsunción (Brooks, 1986)</h1>
<p>Propuesta por Rodney Brooks como alternativa radical a la robótica simbólica dominante en los años 80, bajo el lema <strong>&quot;inteligencia sin representación&quot;</strong> (Brooks, 1991).</p>
<p><strong>Idea central</strong>: en lugar de un único módulo central &quot;inteligente&quot;, el comportamiento se organiza en <strong>capas independientes de comportamiento</strong>, cada una encargada de una competencia concreta (evitar obstáculos, deambular, explorar...).</p>
<ul>
<li>Cada capa conecta sensores con actuadores de forma directa</li>
<li>Las capas se ejecutan en paralelo</li>
<li>Las capas superiores pueden <strong>subsumir</strong> (inhibir o sustituir) el comportamiento de las inferiores cuando es necesario</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="etsisi" data-marpit-pagination="21" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>La arquitectura de subsunción (Brooks, 1986)</h1>
<center>
<p><img src="images/t4/Brooks_Subsumption.png" alt="" style="width:500px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.researchgate.net/publication/225257926_Integrated_cognitive_architectures_A_survey">https://www.researchgate.net/publication/225257926_Integrated_cognitive_architectures_A_survey</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="etsisi" data-marpit-pagination="22" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arbitraje entre capas</h1>
<p>El mecanismo que decide qué capa <em>gana</em> en cada instante es crítico en esta arquitectura:</p>
<ul>
<li><strong>Inhibición</strong>: una capa superior puede bloquear la entrada de una capa inferior</li>
<li><strong>Supresión</strong>: una capa superior puede sustituir la salida de una capa inferior por la suya propia</li>
</ul>
<p>Este arbitraje es lo que permite que comportamientos simples y locales (cada capa) den lugar a un comportamiento global coherente <strong>sin que ninguna capa &quot;entienda&quot; el objetivo completo</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="etsisi" data-marpit-pagination="23" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arbitraje entre capas: Ejemplo 1</h1>
<center>
<p><img src="images/t4/Subsumption_Example_2.png" alt="" style="width:800px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.researchgate.net/publication/220978571_Multi-Agent_Coordination_Using_Dynamic_Behavior-Based_Subsumption">https://www.researchgate.net/publication/220978571_Multi-Agent_Coordination_Using_Dynamic_Behavior-Based_Subsumption</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="etsisi" data-marpit-pagination="24" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arbitraje entre capas: Ejemplo 2</h1>
<center>
<p><img src="images/t4/Subsumption_Example.png" alt="" style="width:1000px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.researchgate.net/publication/290772545_Practical_Education_Curriculum_for_Autonomous_Mobile_Robot_Project_Learning_Program_for_School_Based_on_Subsumption_Architecture">https://www.researchgate.net/publication/290772545_Practical_Education_Curriculum_for_Autonomous_Mobile_Robot_Project_Learning_Program_for_School_Based_on_Subsumption_Architecture</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="etsisi" data-marpit-pagination="25" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Comportamiento emergente y ejemplos</h1>
<p>Cuando varias capas reactivas simples interactúan, puede surgir un comportamiento global que <strong>parece</strong> complejo o incluso deliberado, sin que exista ningún plan explícito. A esto se le llama <strong>comportamiento emergente</strong>.</p>
<ul>
<li>Robots aspiradores domésticos (p. ej. Roomba)</li>
<li>Robots insectoides de investigación (inspirados en insectos sociales)</li>
<li>Enjambres de robots simples que cooperan sin coordinación central</li>
</ul>
<center>
<p><img src="images/t4/Insectoid_Robot.png" alt="" style="width:300px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://interestingengineering.com/innovation/insect-inspired-robot-has-people-bugging">https://interestingengineering.com/innovation/insect-inspired-robot-has-people-bugging</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="etsisi" data-marpit-pagination="26" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Ventajas y limitaciones de las arquitecturas reactivas</h1>
<table>
<thead>
<tr>
<th>Ventajas</th>
<th>Limitaciones</th>
</tr>
</thead>
<tbody>
<tr>
<td>Respuesta muy rápida</td>
<td>Sin memoria de largo plazo</td>
</tr>
<tr>
<td>Robustas ante entornos dinámicos</td>
<td>Difícil perseguir objetivos complejos o a largo plazo</td>
</tr>
<tr>
<td>Simples de implementar y depurar por capa</td>
<td>El comportamiento global es difícil de predecir de antemano</td>
</tr>
<tr>
<td>Buena tolerancia a fallos parciales</td>
<td>No pueden &quot;explicar&quot; por qué hicieron algo</td>
</tr>
</tbody>
</table>
<p><strong>¿Cuándo elegir una arquitectura reactiva?</strong></p>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>Cuando el entorno es muy dinámico, impredecible,y la velocidadde respuesta 
importa más que la sofisticación del razonamiento.
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="27" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">
<h2>Arquitecturas deliberativas</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="etsisi" data-marpit-pagination="28" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>El ciclo sense-plan-act</h1>
<p>Siguen el enfoque clásico y simbólico de la IA agéntica: <strong>sentir → planificar → actuar</strong>.</p>
<ul>
<li>El agente construye y mantiene un <strong>modelo simbólico interno</strong> del mundo</li>
<li>Antes de actuar, <strong>razona</strong> sobre ese modelo: analiza opciones, genera y compara planes</li>
<li>Solo al final del ciclo se ejecuta una acción</li>
</ul>
<p>Este enfoque contrasta frontalmente con el de las arquitecturas reactivas, donde no existe esta fase <strong>explícita</strong> de planificación.</p>
<center>
<p><img src="images/t4/SensePlanAct.jfif" alt="" style="width:800px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.teachkidsrobotics.com/what-is-a-robot/">https://www.teachkidsrobotics.com/what-is-a-robot/</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="etsisi" data-marpit-pagination="29" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Representación simbólica y planificación</h1>
<ul>
<li>El conocimiento se representa mediante <strong>símbolos</strong> manipulables (estados, predicados, reglas lógicas), no directamente como señales sensoriales crudas</li>
<li>Se emplean <strong>mecanismos de planificación</strong> que permiten al agente diseñar una secuencia de acciones para alcanzar sus objetivos antes de ejecutarlas</li>
</ul>
<p>Un referente histórico de planificador simbólico es <strong>STRIPS</strong> (Fikes &amp; Nilsson, 1971), que formalizó estados, acciones, precondiciones y efectos</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="etsisi" data-marpit-pagination="30" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arquitecturas de pizarra (blackboard)</h1>
<p>Un patrón deliberativo clásico es la <strong>arquitectura de pizarra</strong> (Hayes-Roth, 1985):</p>
<ul>
<li>Existe una <strong>estructura de datos</strong> compartida (la &quot;pizarra&quot;) visible para todos los módulos</li>
<li>Distintos módulos especializados (&quot;fuentes de conocimiento&quot;) leen y escriben en la pizarra de forma oportunista</li>
<li>Un módulo de control decide <strong>qué</strong> fuente de conocimiento actúa en cada momento</li>
</ul>
<p>Es útil cuando un problema requiere combinar conocimiento de naturalezas muy distintas (por ejemplo, visión + lenguaje + planificación) sin forzar un flujo rígido entre ellos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="etsisi" data-marpit-pagination="31" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arquitecturas de pizarra (blackboard)</h1>
<center>
<p><img src="images/t4/BlackboardDiagram.png" alt="" style="width:500px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.researchgate.net/publication/4141312_Event-based_blackboard_architecture_for_multi-agent_systems">https://www.researchgate.net/publication/4141312_Event-based_blackboard_architecture_for_multi-agent_systems</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="etsisi" data-marpit-pagination="32" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Meta-razonamiento</h1>
<p>Las arquitecturas deliberativas más avanzadas pueden realizar <strong>meta-razonamiento</strong>: razonar sobre su propio proceso de razonamiento.</p>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://twemoji.maxcdn.com/2/svg/26a0.svg" data-marp-twemoji=""/> <strong>Ejemplo</strong>: decidir <strong>cuánto tiempo</strong> dedicar a planificar antes de que la ventana de oportunidad para actuar se cierre</li>
<li>Permite mayor <strong>flexibilidad y adaptabilidad</strong>: el agente no solo resuelve el problema, sino que gestiona sus propios recursos de razonamiento</li>
</ul>
<p>Es muy común hoy en día, desde que existe la IA con razonamiento y las técnicas chain-of-thought</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="etsisi" data-marpit-pagination="33" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Ventajas y limitaciones de las arquitecturas deliberativas</h1>
<table>
<thead>
<tr>
<th>Ventajas</th>
<th>Limitaciones</th>
</tr>
</thead>
<tbody>
<tr>
<td>Comportamiento complejo</td>
<td>Lentas: planificar cuesta tiempo de cómputo</td>
</tr>
<tr>
<td>Explican y justifican decisiones</td>
<td>Frágiles ante entornos muy dinámicos</td>
</tr>
<tr>
<td>Razonan antes de actuar</td>
<td>Requieren un modelo correcto y actualizado</td>
</tr>
<tr>
<td>Reutilizan conocimiento</td>
<td>Mayor coste de implementación y mantenimiento</td>
</tr>
</tbody>
</table>
<p><strong>¿Cuándo elegir una arquitectura deliberativa?</strong></p>
<pre><code><svg data-marp-fitting="svg" data-marp-fitting-code><foreignObject><span data-marp-fitting-svg-content><span data-marp-fitting-svg-content-wrap>Cuando el entorno es relativamente predecible, hay tiempo para planificar,
y el objetivo requiere razonamiento a medio o largo plazo (logística,
planificación de rutas complejas, negociación).
</span></span></foreignObject></svg></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="34" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">
<h2>Arquitecturas híbridas</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="etsisi" data-marpit-pagination="35" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Motivación: lo mejor de ambos mundos</h1>
<p>Ni lo puramente reactivo ni lo puramente deliberativo basta en la mayoría de robots reales:</p>
<ul>
<li>Un robot <strong>solo reactivo</strong> no puede perseguir objetivos complejos a largo plazo</li>
<li>Un robot <strong>solo deliberativo</strong> puede ser demasiado lento para reaccionar ante un obstáculo repentino</li>
</ul>
<p>Las <strong>arquitecturas híbridas</strong> combinan ambos enfoques organizándolos en <strong>capas</strong> que operan a distinta velocidad y con distinto nivel de abstracción.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="etsisi" data-marpit-pagination="36" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arquitecturas híbrida</h1>
<center>
<p><img src="images/t4/3layers_Architecture.ppm" alt="" style="width:700px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.researchgate.net/publication/351819214_Towards_a_Unified_Representation_for_Human-Robot_Control_Architectures">https://www.researchgate.net/publication/351819214_Towards_a_Unified_Representation_for_Human-Robot_Control_Architectures</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="etsisi" data-marpit-pagination="37" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arquitecturas en tres capas</h1>
<p>Un patrón híbrido muy extendido organiza el sistema en tres niveles (Gat, 1998):</p>
<ol>
<li><strong>Capa reactiva (control)</strong>: bucles de control rápidos, de bajo nivel, tipo reflejo (evitar colisión inminente)</li>
<li><strong>Capa de secuenciación / ejecución</strong>: traduce planes de alto nivel en secuencias de comportamientos reactivos, gestiona el orden y las excepciones</li>
<li><strong>Capa deliberativa (planificación)</strong>: opera a más largo plazo, con modelos simbólicos y planificación, y sin restricción estricta de tiempo real</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="etsisi" data-marpit-pagination="38" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Ejemplos de arquitecturas híbridas de referencia</h1>
<ul>
<li><strong>AuRA</strong> (Autonomous Robot Architecture, Arkin, 1989): combina esquemas motores reactivos con planificación jerárquica de alto nivel</li>
<li><strong>InteRRaP</strong> (Müller &amp; Pischel, 1994): organiza el agente en capas de comportamiento, planificación local y planificación cooperativa/social</li>
</ul>
<p><strong>Por qué importan hoy</strong>: la inmensa mayoría de robots físicos autónomos en producción (coches autónomos, robots de almacén, drones) usan arquitecturas híbridas, no arquitecturas puras. Son el punto de equilibrio práctico entre velocidad de reacción y capacidad de razonamiento.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="39" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">
<h2>Arquitecturas BDI (Belief-Desire-Intention)</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="etsisi" data-marpit-pagination="40" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Fundamento formal de BDI</h1>
<p>Las arquitecturas <strong>BDI</strong> (Rao &amp; Georgeff, 1995) son la traducción directa de la postura intencional a una arquitectura implementable, mediante tres <strong>estructuras de datos</strong> explícitas:</p>
<ul>
<li><strong>Beliefs (creencias)</strong>: lo que el agente cree que es cierto sobre el mundo (puede ser incorrecto o estar desactualizado)</li>
<li><strong>Desires (deseos)</strong>: los objetivos que el agente querría alcanzar, no necesariamente todos compatibles entre sí</li>
<li><strong>Intentions (intenciones)</strong>: el subconjunto de deseos que el agente <strong>se ha comprometido</strong> activamente a perseguir en <strong>este momento</strong></li>
</ul>
<p>La diferencia entre deseo e intención es clave: un agente puede desear muchas cosas a la vez, pero solo puede comprometerse a perseguir un subconjunto consistente de ellas.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="etsisi" data-marpit-pagination="41" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Fundamento formal de BDI</h1>
<center>
<p><img src="images/t4/BDI_Architecture.png" alt="" style="width:550px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.researchgate.net/publication/292140170_A_model_for_an_Information_security_management_system_ISMS_Tool_based_multi_agent_system">https://www.researchgate.net/publication/292140170_A_model_for_an_Information_security_management_system_ISMS_Tool_based_multi_agent_system</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="etsisi" data-marpit-pagination="42" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>El ciclo de deliberación BDI</h1>
<p>En cada ciclo, un agente BDI típicamente:</p>
<ol>
<li>Actualiza sus <strong>creencias</strong> a partir de nuevas percepciones</li>
<li>Genera <strong>opciones</strong> de deseos posibles a partir de las creencias actuales</li>
<li><strong>Delibera</strong>: filtra esas opciones y decide qué subconjunto se convierte en <strong>intenciones</strong></li>
<li>Ejecuta un <strong>plan</strong> asociado a cada intención activa, revisándolo si las creencias cambian sustancialmente</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="etsisi" data-marpit-pagination="43" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Sistemas BDI de referencia</h1>
<ul>
<li><strong>PRS</strong> (Procedural Reasoning System, Georgeff &amp; Lansky, 1987): uno de los primeros sistemas en implementar el modelo BDI de forma práctica</li>
<li><strong>dMARS</strong>: evolución de PRS orientada a sistemas multiagente distribuidos</li>
<li><strong>Jason</strong>: intérprete moderno y de código abierto del lenguaje AgentSpeak, ampliamente usado hoy en investigación y docencia (Bordini, Hübner &amp; Wooldridge, 2007)</li>
</ul>
<p><strong>Aplicaciones típicas</strong>: agentes software autónomos de larga duración, sistemas de gestión de crisis, y —lo que nos interesa especialmente— <strong>softbots</strong>, que veremos en detalle más adelante.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="44" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">
<h2>Arquitecturas cognitivas</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="etsisi" data-marpit-pagination="45" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Arquitecturas cognitivas</h1>
<p>Un tipo particular de arquitectura deliberativa busca no solo que el agente se comporte de forma racional, sino <strong>modelar cómo razona la mente humana</strong>. Se las conoce como <strong>arquitecturas cognitivas</strong>.</p>
<p>Se mencionan aquí como mapa de referencia: su uso principal está más en la <strong>investigación en ciencia cognitiva</strong> que en robots de producción, pero conviene conocer que existen si en el futuro profundizas en agentes inteligentes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="etsisi" data-marpit-pagination="46" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>SOAR (Laird, Newell &amp; Rosenbloom, 1987)</h1>
<p>Orientada a la resolución de problemas mediante búsqueda en espacios de estados y aprendizaje por fragmentación</p>
<center>
<p><img src="images/t4/SOAR_Architecture.png" alt="" style="width:700px;" /></p>
</center>
<blockquote>

<h1>ACT-R</h1>
<p>Modelo de cognición humana que distingue memoria declarativa y memoria procedimental, muy usado en psicología cognitiva computacional</p>
<center>
<p><img src="images/t4/Act-R.png" alt="" style="width:500px;" /></p>
</center>
<blockquote>

</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="48" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">
<h2>Arquitecturas multiagente</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="etsisi" data-marpit-pagination="49" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>De un agente a varios</h1>
<p>Hasta ahora hemos hablado de la arquitectura de <strong>un</strong> agente. Pero en la práctica, y especialmente en softbots y RPA, es habitual que <strong>varios agentes coexistan y cooperen</strong>.</p>
<ul>
<li>Un <strong>sistema multiagente (SMA)</strong> es un conjunto de agentes que interactúan entre sí, cada uno con su propia arquitectura interna</li>
<li>Pueden cooperar hacia un objetivo común, competir por recursos, o simplemente coexistir en el mismo entorno</li>
</ul>
<p>Esto añade una capa de complejidad nueva: ya no basta con decidir bien de forma individual, hay que <strong>coordinarse</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="etsisi" data-marpit-pagination="50" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Comunicación entre agentes</h1>
<p>Para que los agentes cooperen necesitan un lenguaje común. Un estándar histórico de referencia es <strong>FIPA-ACL</strong> (Agent Communication Language), que define actos comunicativos como &quot;informar&quot;, &quot;solicitar&quot; o &quot;proponer&quot; entre agentes (FIPA, 2002).</p>
<ul>
<li>Permite que agentes construidos por distintos desarrolladores, con arquitecturas internas distintas, se entiendan</li>
<li>Es la base conceptual de mucha coordinación multiagente posterior, incluida buena parte de la orquestación de agentes moderna que veremos en el Bloque 10</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="etsisi" data-marpit-pagination="51" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">

</center>
<blockquote>

<h1>Coordinación y organización</h1>
<p>Algunas estrategias comunes para organizar sistemas multiagente:</p>
<ul>
<li><strong>Jerárquica</strong>: un agente coordinador asigna tareas a agentes subordinados</li>
<li><strong>Por mercado</strong>: los agentes &quot;pujan&quot; por tareas o recursos</li>
<li><strong>Por consenso</strong>: los agentes negocian hasta llegar a un acuerdo compartido</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="53" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="etsisi" data-marpit-pagination="56" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Por qué este bloque</h1>
<p>En los últimos años una nueva generación de agentes usa un <strong>modelo de lenguaje<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> (LLM)</strong> como &quot;cerebro&quot; central de decisión, en lugar de reglas simbólicas escritas a mano o planificadores clásicos.</p>
<p>Lo importante: <strong>el ciclo percepción-decisión-acción del Bloque 1 no ha cambiado</strong><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></svg></mjx-container>. Lo que cambia es cómo se implementa la caja de decisión, y con qué velocidad ha evolucionado el campo en los últimos años.</p>
<blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 436.6 833.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container>: Están por todas partes<br />
<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.885ex" role="img" focusable="false" viewBox="0 -833.2 436.6 833.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></g></svg></mjx-container>: Es lo bueno de la filosofía, que no está atada a los avances tecnológicos</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="etsisi" data-marpit-pagination="57" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>El bucle ReAct</h1>
<p><strong>ReAct</strong> (Yao et al., 2023) propone intercalar explícitamente <strong>razonamiento</strong> (pensar en texto qué hacer) y <strong>acción</strong> (ejecutar una herramienta) dentro del mismo bucle:</p>
<ol>
<li>El modelo genera un <strong>pensamiento</strong> (&quot;necesito buscar el precio actual&quot;)</li>
<li>El modelo genera una <strong>acción</strong> (llamar a una herramienta de búsqueda)</li>
<li>El entorno devuelve una <strong>observación</strong> (el resultado de la búsqueda)</li>
<li>El modelo genera el siguiente <strong>pensamiento</strong> a partir de esa observación</li>
</ol>
<p>Es, en esencia, un ciclo <strong>sense-plan-act</strong><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></svg></mjx-container>: donde el &quot;planificador&quot; es un LLM que razona en lenguaje natural en lugar de símbolos lógicos formales.</p>
<blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0" xmlns="http://www.w3.org/2000/svg" width="0.988ex" height="1.904ex" role="img" focusable="false" viewBox="0 -841.7 436.6 841.7"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"></g><g data-mml-node="mn" transform="translate(33,363) scale(0.707)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path></g></g></g></g></svg></mjx-container>: Como siempre, pensamos que re-inventamos la rueda, pero no todo es tan novedoso como lo venden</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="etsisi" data-marpit-pagination="58" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>El bucle ReAct</h1>
<center>
<p><img src="images/t4/ReAct_Loop.png" alt="" style="width:500px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://peterroelants.github.io/posts/react-repl-agent/">https://peterroelants.github.io/posts/react-repl-agent/</a></p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="etsisi" data-marpit-pagination="59" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Planificación: Plan-and-Execute frente a ReAct</h1>
<ul>
<li><strong>ReAct</strong>: decide un paso, lo ejecuta, observa, decide el siguiente — bueno para tareas cortas y muy dependientes del contexto</li>
<li><strong>Plan-and-Execute</strong>: primero genera una lista completa de pasos, y después los ejecuta uno a uno, revisando el plan si algo falla — mejor para tareas largas y complejas</li>
</ul>
<p>Esta distinción es literalmente el mismo debate reactivo-vs-deliberativo anterior.</p>
<center>
<p><img src="images/t4/React_PlanAndExecute.jpg" alt="" style="width:600px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://peterroelants.github.io/posts/react-repl-agent/">https://peterroelants.github.io/posts/react-repl-agent/</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="etsisi" data-marpit-pagination="60" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Memoria en agentes modernos</h1>
<ul>
<li><strong>Memoria de corto plazo</strong>: la propia ventana de contexto del modelo</li>
<li><strong>Memoria de largo plazo</strong>: una base de datos que almacena información pasada</li>
<li><strong>RAG</strong> (Retrieval-Augmented Generation, Lewis et al., 2020): técnica que combina recuperación de información externa con generación de texto</li>
</ul>
<center>
<p><img src="images/t4/LLM_Memories.png" alt="" style="width:450px;" /></p>
</center>
<blockquote>
<p>Fuente: <a href="https://www.instagram.com/p/DRg9y14iR1m/">https://www.instagram.com/p/DRg9y14iR1m/</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="etsisi" data-marpit-pagination="61" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Uso de herramientas (tool use)</h1>
<p>La capacidad de un agente LLM de invocar herramientas externas, una API, una búsqueda web, una calculadora, un intérprete de código, es la evolución directa del concepto clásico de <strong>actuador</strong>, adaptado a un entorno digital.</p>
<ul>
<li>El modelo decide <strong>qué herramienta</strong> usar y <strong>con qué parámetros</strong>, a partir de una descripción de la herramienta disponible</li>
<li>Este patrón se popularizó con trabajos como Toolformer (Schick et al., 2023) y es hoy un estándar en prácticamente todos los frameworks de agentes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="etsisi" data-marpit-pagination="62" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Frameworks y orquestación actuales</h1>
<p>El ecosistema de herramientas para construir agentes LLM ha madurado rápidamente:</p>
<ul>
<li><strong>LangChain / LangGraph</strong>: construcción de flujos de agentes y grafos de ejecución</li>
<li><strong>AutoGen / Microsoft Agent Framework</strong>: orquestación de agentes, con el segundo consolidándose durante 2025-2026 como runtime unificado sobre conceptos ya presentes en Semantic Kernel y AutoGen (Future AGI, 2026)</li>
<li><strong>CrewAI</strong>: orquestación de equipos de agentes con roles definidos</li>
</ul>
<p>Este panorama cambia con rapidez: lo importante no son los nombres concretos de las herramientas, sino los <strong>patrones de diseño subyacentes</strong>, que sí son estables.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="etsisi" data-marpit-pagination="63" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Orquestación multiagente moderna</h1>
<p>La tendencia dominante en 2026 ya no es un único agente LLM resolviendo todo, sino <strong>varios agentes especializados colaborando bajo una capa de orquestación</strong>.</p>
<p>La coordinación combina agentes de IA, bots deterministas tipo RPA, APIs y personas, todo dentro del mismo flujo (SS&amp;C Blue Prism, 2026).</p>
<p>Esto no es casual: es la misma idea de <strong>arquitectura híbrida</strong>, combinar lo reactivo/determinista con lo deliberativo/flexible, aplicada ahora a gran escala en sistemas de automatización empresarial</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="etsisi" data-marpit-pagination="64" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>BDI clásico frente a agente LLM moderno</h1>
<table>
<thead>
<tr>
<th>Concepto BDI (1995)</th>
<th>Equivalente en agente LLM (2026)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Creencias</td>
<td>Contexto + memoria recuperada (RAG)</td>
</tr>
<tr>
<td>Deseos</td>
<td>Objetivo/tarea indicada en el prompt</td>
</tr>
<tr>
<td>Intenciones</td>
<td>Plan activo en curso de ejecución</td>
</tr>
<tr>
<td>Ciclo de deliberación</td>
<td>Bucle ReAct / Plan-and-Execute</td>
</tr>
<tr>
<td>Comunicación entre agentes (FIPA-ACL)</td>
<td>Protocolos de orquestación multiagente</td>
</tr>
</tbody>
</table>
<p>La conclusión no es que &quot;todo sea nuevo&quot;, sino que <strong>los mismos problemas de diseño de siempre siguen ahí</strong>, lo que ha cambiado es la tecnología que implementa cada pieza.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-class="section" data-theme="etsisi" class="section" data-marpit-pagination="65" data-marpit-pagination-total="72" style="--paginate:true;--class:section;--theme:etsisi;">
<h1>Bloque 3</h1>
<h2>Por qué todo esto importa</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="etsisi" data-marpit-pagination="66" data-marpit-pagination-total="72" style="--paginate:true;--theme:etsisi;">
<h1>Síntesis</h1>
<p>Todas las arquitecturas vistas hoy resuelven <strong>el mismo problema</strong>: percibir, decidir y actuar. Lo que las diferencia son los <strong>compromisos</strong> que asumen:</p>
<ul>
<li>Velocidad <strong>vs.</strong> capacidad de razonamiento</li>
<li>Simplicidad <strong>vs.</strong> explicabilidad</li>
<li>Autonomía individual <strong>vs.</strong> coordinación multiagente</li>
</ul>
<p>No existe &quot;la mejor arquitectura&quot; en abstracto: existe la arquitectura adecuada <strong>para un problema concreto</strong>, con sus restricciones de tiempo, entorno y objetivos.</p>
</section>
